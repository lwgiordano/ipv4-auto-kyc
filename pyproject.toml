[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-tool"
version = "0.1.0"
description = "IPv4.Global KYC/KYB scoring engine (platform-invoked)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "import-linter>=2.0",
    "pytest-cov>=5",
    # The TechCraft contract documents render from docs/contracts and are verified by BUILDING
    # them and extracting the text (tests/unit/test_contract_rendering.py). Both belong in the
    # dev extra so CI proves the rendered page, not just the registry.
    "reportlab>=4.0",
    "pdfplumber>=0.11",
    # The painted-page authority (docs/generators/artifact.py, R-audit-12 finding 1) rasterizes
    # each staged page twice — as published and with the text layer removed — and imports
    # pypdfium2 directly for the object-removal walk. It arrives with pdfplumber anyway; a
    # direct import deserves a direct declaration, not a transitive accident.
    "pypdfium2>=4.18",
    # The typed playbook bodies (docs/contracts/body.py) refuse code blocks inside prose
    # by consuming a REAL CommonMark block tree (R-audit-15): a line-prefix check missed
    # fences nested in blockquotes, indented code, and raw <pre>. Doc-side only, like the
    # two renderers above — src/kyc_tool never imports docs/contracts.
    "markdown-it-py>=3.0",
]
s3 = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc_tool = ["ui/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]  # ternary-vs-if is a style call, not a defect

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires a PostgreSQL server (ephemeral cluster or DATABASE_URL)",
]

[tool.importlinter]
root_package = "kyc_tool"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "pure core stays pure (domain/validators/policy)"
type = "forbidden"
source_modules = ["kyc_tool.domain", "kyc_tool.validators", "kyc_tool.policy"]
forbidden_modules = [
    "sqlalchemy",
    "httpx",
    "boto3",
    "kyc_tool.db",
    "kyc_tool.storage",
    "kyc_tool.queue",
    "kyc_tool.outbox",
    "kyc_tool.api",
    "kyc_tool.orchestration",
    "kyc_tool.checkstore",
]

[[tool.importlinter.contracts]]
name = "adapters fetch only (no persistence)"
type = "forbidden"
source_modules = ["kyc_tool.adapters"]
forbidden_modules = ["kyc_tool.db", "kyc_tool.checkstore", "sqlalchemy"]
