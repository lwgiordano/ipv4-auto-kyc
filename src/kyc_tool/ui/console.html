/* ── Hilco brand tokens ──
   Values copied verbatim from the brand pack's generated framework
   (hilco-design-system/components/hilco.css, built from brands/hilco/theme.tokens.json).
   The console never re-derives a brand value: every colour, size, radius and duration below
   resolves to one of these, and every state a colour can be in is named here ONCE
   (craftLaws.accentSystem LX1) so no component mixes its own hover blue at the call site. */
:root{
  --surface-page:#f6f7f8; --surface:#ffffff; --surface-muted:#ebedf0; --surface-inverse:#1d1e21;
  --text-strong:#1d1e21; --text:#3e4246; --text-muted:#676c72; --text-faint:#81878d;
  --text-inverse:#f6f7f8;
  --border:#d6d9dd; --border-strong:#bbc0c5; --border-input:#81878d;
  --accent:#0072ce; --accent-text:#0072ce; --accent-soft:#f4f8fe; --accent-ink:#003087;
  --on-accent:#ffffff; --accent-focus-ring:#0072ce; --accent-on-dark:#0072ce;
  --accent-hover:color-mix(in oklab,var(--accent),var(--mix-ink) 8%);
  --accent-pressed:color-mix(in oklab,var(--accent),var(--mix-ink) 12%);
  --success:#008237; --warning:#a05600; --danger:#cb0314; --danger-text:#a30015; --info:#1672ab;
  --mix-ink:black; --soft-mix:white 88%; --ink-mix:black 25%;
  --r:6px; --pill:6px; --radius-inner:4px; --radius-container:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --e1:0 1px 2px rgba(29,30,33,0.06);
  --e2:0 4px 12px rgba(29,30,33,0.08);
  --e3:0 12px 32px rgba(29,30,33,0.12);
  --dur-1:90ms; --dur-2:120ms; --dur-3:150ms; --dur-4:240ms;
  --ease-standard:cubic-bezier(.2,0,0,1);
  --frame-side-nav:240px; --row-h:36px;
  --font:'Mulish',system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
  /* Status tints derive from the semantic hue by the pack's badge recipe — mixing toward
     --soft-mix for the ground and --ink-mix for the text. Both mixers flip under dark, so
     these four pairs re-resolve there without a second set of hand-picked colours. */
  --green-soft:color-mix(in oklab,var(--success),var(--soft-mix));
  --green-ink:color-mix(in oklab,var(--success),var(--ink-mix));
  --amber-soft:color-mix(in oklab,var(--warning),var(--soft-mix));
  --amber-ink:color-mix(in oklab,var(--warning),var(--ink-mix));
  --red-soft:color-mix(in oklab,var(--danger),var(--soft-mix));
  --red-ink:var(--danger-text);
  --blue-soft:color-mix(in oklab,var(--info),var(--soft-mix));
  --blue-ink:color-mix(in oklab,var(--info),var(--ink-mix));
  /* Names this console's markup and inline styles already speak, aliased onto the pack.
     Retinting the brand retints the console; there is no second source of truth. */
  --bg:var(--surface-page); --ink:var(--text-strong); --muted:var(--text-muted);
  --faint:var(--text-faint); --line:var(--border); --line-strong:var(--border-strong);
  --green:var(--green-ink); --amber:var(--amber-ink); --red:var(--red-ink); --blue:var(--blue-ink);
  --shadow-sm:var(--e1); --shadow-md:var(--e2);
  --r-md:var(--r); --r-sm:var(--r); --r-xs:var(--radius-inner);
}
/* Dark: an explicit choice wins in both directions, and the system default follows the OS. */
[data-theme=dark]{
  --surface-page:#1d1e21; --surface:#2b2e31; --surface-muted:#3e4246; --surface-inverse:#f6f7f8;
  --text-strong:#f6f7f8; --text:#d6d9dd; --text-muted:#bbc0c5; --text-faint:#81878d;
  --text-inverse:#1d1e21;
  --border:#51565b; --border-strong:#676c72; --border-input:#81878d;
  --accent:#0072ce; --accent-text:#90c4ff; --accent-soft:#00205b; --accent-ink:#90c4ff;
  --success:#008237; --warning:#a05600; --danger:#cb0314; --danger-text:#f2a298; --info:#1672ab;
  --mix-ink:white; --soft-mix:black 70%; --ink-mix:white 55%;
  --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 4px 12px rgba(0,0,0,.45); --e3:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]):not([data-theme=dark]){
    --surface-page:#1d1e21; --surface:#2b2e31; --surface-muted:#3e4246; --surface-inverse:#f6f7f8;
    --text-strong:#f6f7f8; --text:#d6d9dd; --text-muted:#bbc0c5; --text-faint:#81878d;
    --text-inverse:#1d1e21;
    --border:#51565b; --border-strong:#676c72; --border-input:#81878d;
    --accent:#0072ce; --accent-text:#90c4ff; --accent-soft:#00205b; --accent-ink:#90c4ff;
    --success:#008237; --warning:#a05600; --danger:#cb0314; --danger-text:#f2a298; --info:#1672ab;
    --mix-ink:white; --soft-mix:black 70%; --ink-mix:white 55%;
    --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 4px 12px rgba(0,0,0,.45); --e3:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}

/* ── Base ── */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
     font:16px/24px var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font);color:var(--ink);letter-spacing:-.01em;text-wrap:balance;margin:0}
p{text-wrap:pretty}
/* Numerals that get COMPARED render tabular, table-wide — a table is where numbers are
   compared by definition, and proportional figures make a column shimmy line to line. */
table{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-size:12px;line-height:16px}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-focus-ring);outline-offset:2px;border-radius:var(--radius-inner)}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
.ic{width:16px;height:16px;flex:none}
/* icon + text on one baseline, and the standalone sequence arrow */
.iw{display:inline-flex;align-items:center;gap:var(--s1)}
.arr{color:var(--muted);display:inline-flex;align-items:center;vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── App shell: sidebar + independently scrolling main ── */
.shell{display:flex;height:100vh}
aside{width:var(--frame-side-nav);flex:none;background:var(--surface);
      border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3)}
.brand .mark{width:32px;height:32px;border-radius:var(--r);background:var(--accent);
      color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand .t{font-size:14px;line-height:20px;font-weight:700;color:var(--ink)}
.brand .s{font-size:12px;line-height:16px;color:var(--muted)}
nav{padding:var(--s1) var(--s2);flex:1}
.grp{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
     color:var(--muted);padding:var(--s4) var(--s3) var(--s1)}
.nav-item{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3);margin:2px 0;
     border-radius:var(--r);color:var(--text);font:600 14px/20px var(--font);
     min-height:44px;transition:background-color var(--dur-2) var(--ease-standard)}
.nav-item:hover{background:var(--surface-muted);text-decoration:none}
.nav-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
/* "You are here" carries TWO redundant cues — tint AND weight — never colour alone. */
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav-item.active svg{color:var(--accent-text)}
.nav-item .count{margin-left:auto;background:var(--danger);color:#fff;font-size:12px;line-height:16px;
     font-weight:700;border-radius:var(--pill);padding:0 var(--s2);min-width:20px;text-align:center}
.side-foot{padding:var(--s3) var(--s4);border-top:1px solid var(--line);
     font-size:12px;line-height:16px;color:var(--muted);display:grid;gap:var(--s2)}
.side-foot label{display:flex;align-items:center;gap:var(--s2);cursor:pointer;min-height:44px}
.side-foot input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1160px;margin:0 auto;padding:var(--s5) var(--s6) var(--s8)}

/* ── Page title bar ── */
.tbar{display:flex;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.tbar h1{font-size:24px;line-height:32px;font-weight:800;color:var(--ink);
  display:flex;align-items:center;gap:var(--s2)}
.tbar .desc{font-size:14px;line-height:20px;color:var(--muted);margin-top:var(--s1)}
.tbar .actions{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.crumb{font-size:14px;line-height:20px;color:var(--muted);margin-bottom:var(--s1)}
.crumb a{color:var(--muted)}
.crumb a:hover{color:var(--accent-text)}

/* ── Cards & sections ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      box-shadow:var(--e1)}
.card .hd{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;
      align-items:center;gap:var(--s2);flex-wrap:wrap}
.card .hd h2,.card .hd h3{font-size:16px;line-height:24px;font-weight:700;color:var(--ink)}
/* A heading inside a card BODY, under the card's own header. It had no rule at all and was
   rendering at the UA default with 21.28px margins, off the spacing register entirely. */
.sub-hd{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);margin-bottom:var(--s3)}
.card .hd .hint{font-size:12px;line-height:16px;color:var(--muted);font-weight:400}
.card .bd{padding:var(--s4)}
.card .bd.flush{padding:0}
.stack{display:grid;gap:var(--s4)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}
/* children can never widen their track */
.split>*,.stack>*,.kpis>*,.gates>*,.contrib>*{min-inline-size:0}

/* ── KPI scorecard row ── */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s4);margin-bottom:var(--s4)}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
     box-shadow:var(--e1);padding:var(--s4)}
.kpi .lab{font-size:14px;line-height:20px;font-weight:600;color:var(--muted)}
.kpi .num{font-size:32px;line-height:40px;font-weight:800;letter-spacing:-.02em;color:var(--ink);
     margin-top:var(--s1);font-variant-numeric:tabular-nums}
.kpi .num.bad{color:var(--red)} .kpi .num.ok{color:var(--green)}
.kpi .foot{font-size:12px;line-height:16px;color:var(--muted);margin-top:var(--s1)}

/* ── Status pills / tags ──
   Hilco's badge shape is the 6px --pill token, not a lozenge: status reads from the
   tinted ground plus a non-colour cue (the icon), never from hue alone. */
.pill{display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s3);
      border-radius:var(--pill);font:600 12px/16px var(--font);white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green-ink)}
.p-amber{background:var(--amber-soft);color:var(--amber-ink)}
.p-red{background:var(--red-soft);color:var(--red-ink)}
.p-blue{background:var(--blue-soft);color:var(--blue-ink)}
.p-accent{background:var(--accent-soft);color:var(--accent-ink)}
.p-neutral{background:var(--surface-muted);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:var(--s1);background:var(--surface-muted);
     color:var(--text);border-radius:var(--radius-inner);padding:2px var(--s2);
     font-size:12px;line-height:16px;font-family:var(--mono)}
.tag.warn{background:var(--amber-soft);color:var(--amber-ink)}
.tag.err{background:var(--red-soft);color:var(--red-ink)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th{font:700 12px/16px var(--font);text-transform:uppercase;letter-spacing:.05em;
   color:var(--ink);background:var(--surface-muted);text-align:left;
   padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);vertical-align:top;
   color:var(--text)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .strong{color:var(--ink);font-weight:700}
tbody tr.click{cursor:pointer;transition:background-color var(--dur-2) var(--ease-standard)}
tbody tr.click:hover{background:var(--surface-muted)}
.sub{font-size:12px;line-height:16px;color:var(--muted);margin-top:2px}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:14px;line-height:20px}
.empty b{color:var(--ink);font-weight:700;display:block;margin-bottom:var(--s1);font-size:16px;line-height:24px}

/* ── Buttons & inputs ──
   44px is the hit target, not a look: the visual box may read smaller (--size-element-*),
   the pointer/touch box may not. States come from the pack's mix recipes, never a bespoke hex. */
/* --border-input, not --border-strong: on a white card a quiet button's border IS its only
   boundary, so it has to clear 3:1 (border-strong measures 1.83:1 there). The pack ships
   --border-input as the control-boundary step for exactly this reason. */
button{font:600 14px/20px var(--font);padding:0 var(--s4);min-height:44px;
  border-radius:var(--r);border:1px solid var(--border-input);background:var(--surface);
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:var(--s2);transition:background-color var(--dur-2) var(--ease-standard),
  border-color var(--dur-2) var(--ease-standard)}
button:hover{background:var(--surface-muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.primary:active{background:var(--accent-pressed);border-color:var(--accent-pressed)}
button.sm{padding:0 var(--s3);font-size:12px;line-height:16px}
button.good{background:var(--green-soft);border-color:transparent;color:var(--green-ink)}
button.danger{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
button:disabled{opacity:.45;cursor:default;pointer-events:none}
input,select,textarea{font:16px/24px var(--font);background:var(--surface);color:var(--ink);
  border:1px solid var(--border-input);border-radius:var(--r);padding:0 var(--s3);min-height:44px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in oklab,var(--border-input),var(--mix-ink) 8%)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--accent)}
textarea{min-height:180px;padding:var(--s3);width:100%;
  font-family:var(--mono);font-size:12px;line-height:16px}
.search{position:relative;display:inline-flex;align-items:center}
.search svg{position:absolute;left:var(--s3);width:16px;height:16px;color:var(--muted);
  pointer-events:none}
.search input{padding-left:var(--s7);width:280px}
.field{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.field .flab{font:600 14px/20px var(--font);color:var(--ink)}
.toolbar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s4);flex-wrap:wrap}
.toolbar .note{font-size:12px;line-height:16px;color:var(--muted)}

/* ── Bullet chart (score vs threshold) ── */
.bullet{display:grid;gap:var(--s2)}
.bullet .val{display:flex;align-items:baseline;gap:var(--s2)}
.bullet .val b{font-size:32px;line-height:40px;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);font-variant-numeric:tabular-nums}
.bullet .val .of{font-size:14px;line-height:20px;color:var(--muted)}
.bullet .val .verdict{font-size:12px;line-height:16px;font-weight:700;margin-left:auto}
.btrack{position:relative;height:16px;border-radius:var(--radius-inner);
  background:var(--surface-muted);overflow:visible}
/* The threshold band is gone: its right edge sat exactly under the tick that already marks the
   threshold, so it drew a second grey rectangle that read as another bar — and at 1.21:1 against
   the track it was invisible anyway. Tick plus label carries the target; the bar carries the score,
   in the semantic ink for its outcome (the "N below threshold" verdict is the non-colour cue). */
.bmeasure{position:absolute;top:4px;height:8px;left:0;border-radius:var(--radius-inner)}
.btick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.btick span{position:absolute;top:-20px;transform:translateX(-50%);font-size:12px;line-height:16px;
  color:var(--muted);white-space:nowrap}
/* rubric contribution rows */
.contrib{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s6);margin-top:var(--s4)}
@media(max-width:820px){.contrib{grid-template-columns:1fr}}
.crow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;
  border-bottom:1px solid var(--line);font-size:14px;line-height:20px;min-height:var(--row-h)}
.crow:nth-last-child(-n+2){border-bottom:none}
.crow .nm{color:var(--text)}
.crow .pts{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.crow .pts.zero{color:var(--muted);font-weight:400}
.crow .cap{font-size:12px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums;
  width:44px;text-align:right}
.sdot{width:24px;height:24px;border-radius:9999px;display:inline-grid;place-items:center;flex:none}
.sdot.g{background:var(--green-soft);color:var(--green-ink)}
.sdot.r{background:var(--red-soft);color:var(--red-ink)}
.sdot.a{background:var(--amber-soft);color:var(--amber-ink)}
.sdot.n{background:var(--surface-muted);color:var(--muted)}

/* ── Gate cells (status strip) ── */
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s2)}
.gate{display:flex;align-items:center;gap:var(--s2);border-radius:var(--r);
  padding:var(--s3);font:600 12px/16px var(--font);min-height:44px}
.gate.ok{background:var(--green-soft);color:var(--green-ink)}
.gate.no{background:var(--red-soft);color:var(--red-ink)}
.gate.na{opacity:.55}

/* ── Run pipeline steps ── */
.pipe{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;font-size:12px;line-height:16px}
.pipe .st{padding:2px var(--s2);border-radius:var(--radius-inner);color:var(--muted);
  background:var(--surface-muted)}
.pipe .st.done{color:var(--green-ink);background:var(--green-soft)}
.pipe .st.cur{color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
.pipe .st.fail{color:var(--red-ink);background:var(--red-soft);font-weight:700}
.pipe .arr{color:var(--muted)}

/* ── Activity feed (audit) ── */
.feed{position:relative;padding-left:var(--s5);display:grid;gap:0}
.feed::before{content:"";position:absolute;left:6px;top:var(--s2);bottom:var(--s2);width:2px;
  background:var(--line)}
.fitem{position:relative;padding:var(--s2) 0;font-size:14px;line-height:20px;display:flex;
  gap:var(--s2);align-items:baseline;flex-wrap:wrap}
.fitem::before{content:"";position:absolute;left:-23px;top:14px;width:8px;height:8px;
  border-radius:9999px;background:var(--border-strong);border:2px solid var(--surface)}
.fitem.hot::before{background:var(--accent)}
.when{white-space:nowrap}
.fitem .when{margin-left:auto;font-size:12px;line-height:16px;color:var(--muted)}
.fitem .who{color:var(--ink);font-weight:700}
.fitem .obj{color:var(--muted)}
.fitem details{font-size:12px;line-height:16px}
.fitem details[open]{width:100%;order:10}
summary{color:var(--muted);cursor:pointer;font-size:12px;line-height:16px;min-height:24px}
.feed-earlier{margin:0 0 var(--s2) calc(-1 * var(--s5))}
pre{background:var(--surface-muted);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3);overflow:auto;font-family:var(--mono);font-size:12px;line-height:16px;
  max-height:320px;margin:var(--s2) 0 0}

/* ── Integration rows ── */
.irow{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);
  border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.itile{width:36px;height:36px;border-radius:var(--r);background:var(--accent-soft);
  color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.itile .ic{width:20px;height:20px}
.irow .meta{min-width:0;flex:1}
.irow .nm{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);display:flex;
  gap:var(--s2);align-items:center;flex-wrap:wrap}
.irow .kind{font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
.irow .facts{font-size:12px;line-height:16px;color:var(--muted);margin-top:var(--s2);
  display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.irow .todo{font-size:12px;line-height:16px;color:var(--amber-ink);margin-top:var(--s2)}
.irow .end{margin-left:auto;display:grid;gap:var(--s2);justify-items:end;flex:none}
.probe-out{font-size:12px;line-height:16px;color:var(--muted);font-family:var(--mono);text-align:right}

/* ── kv grid, toast, banner ── */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:var(--s2) var(--s5);
  font-size:14px;line-height:20px}
.kv .k{color:var(--muted)}
/* Toast: inverse surface at the highest elevation, per the pack's toast recipe. */
.toast{position:fixed;bottom:var(--s5);right:var(--s5);background:var(--surface-inverse);
  color:var(--text-inverse);border-radius:var(--r);padding:var(--s2) var(--s4);
  box-shadow:var(--e3);font-size:14px;line-height:20px;max-width:420px;z-index:500;
  display:inline-flex;align-items:center;gap:var(--s2);animation:tin var(--dur-4) var(--ease-standard)}
.toast .ic{width:16px;height:16px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ── Explainers ──
   Every container on this console says, in a sentence, what it is. The trigger is a real
   <button> so the keyboard reaches it: help that only appears under a mouse pointer is help
   half the readers never get. The bubble mounts on <body> at fixed position, so a card's own
   scrolling can never clip it, and it takes no pointer events — you read it, you don't use it.
   Inverse ground at the top elevation, the same recipe as the toast. */
.tipbtn{width:24px;height:24px;min-height:0;padding:0;border:0;border-radius:9999px;
  background:var(--surface-muted);color:var(--muted);position:relative;flex:none;
  transition:background-color var(--dur-2) var(--ease-standard),color var(--dur-2) var(--ease-standard)}
.tipbtn .ic{width:16px;height:16px;pointer-events:none}
.tipbtn:hover{background:var(--accent-soft);color:var(--accent-ink)}
/* The dot reads at 24px; the box a finger or a pointer has to hit is the 44px floor. */
.tipbtn::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.tip{position:fixed;z-index:600;max-width:300px;background:var(--surface-inverse);
  color:var(--text-inverse);border-radius:var(--r);padding:var(--s3) var(--s4);
  box-shadow:var(--e3);font:400 12px/16px var(--font);pointer-events:none;
  animation:tipin var(--dur-1) var(--ease-standard)}
.tip b{display:block;font-weight:700;font-size:14px;line-height:20px;margin-bottom:var(--s2)}
.tip p{margin:0 0 var(--s2)}
.tip p:last-child{margin-bottom:0}
.tip dl{display:grid;gap:var(--s1);margin:var(--s2) 0 0}
.tip dt{font-family:var(--mono);font-size:12px;line-height:16px;font-weight:700;
  overflow-wrap:anywhere}
.tip dd{margin:0 0 var(--s2)}
.tip dd:last-child{margin-bottom:0}
@keyframes tipin{from{opacity:0}to{opacity:1}}
/* A term of art keeps its name and gains its meaning in the same breath. */
.gloss{font-weight:400;font-size:12px;line-height:16px;color:var(--muted)}
.card .hd .tipbtn{margin-left:auto}
/* The 44px hit box overhangs the 24px dot by 10px a side. Beside plain text that is free; beside
   a control it would eat the neighbour's edge, so in a toolbar the dot keeps its own clearance. */
.toolbar .tipbtn{margin-left:var(--s2)}
/* Status callouts are TINTED PANELS — never a coloured spine. Severity reads from the
   ground tint and the bold lead-in. */
.banner{display:flex;gap:var(--s3);align-items:center;background:var(--red-soft);
  color:var(--red-ink);border:1px solid color-mix(in oklab,var(--danger),var(--surface) 72%);
  border-radius:var(--r);padding:var(--s3) var(--s4);font-size:14px;line-height:20px;
  font-weight:600;margin-bottom:var(--s4)}
.banner .ic{width:16px;height:16px}
.banner a{color:inherit;font-weight:700;text-decoration:underline}
/* The same tinted-panel recipe at warning severity, for a state that is not an error: the
   enforcement hold. It sits INSIDE the published-decision card, under the word it explains. */
.callout{display:flex;gap:var(--s3);align-items:flex-start;border-radius:var(--r);
  padding:var(--s3) var(--s4);font-size:14px;line-height:20px;margin:var(--s3) 0 var(--s4)}
.callout.amber{background:var(--amber-soft);color:var(--amber-ink);
  border:1px solid color-mix(in oklab,var(--warning),var(--surface) 72%)}
.callout .ic{margin-top:2px}
.callout b{display:block;font-weight:700;margin-bottom:var(--s1)}
.callout a{color:inherit;font-weight:700;text-decoration:underline}
/* The rulebook row a case page linked to: tinted, and focusable so the jump is announced. */
tr.hl td{background:var(--accent-soft)}
tr.hl:focus-visible{outline-offset:-2px}
.loading{color:var(--muted);font-size:14px;line-height:20px;padding:var(--s7);text-align:center}
h2.sec{font:700 12px/16px var(--font);color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin:var(--s6) 0 var(--s3);
  display:flex;align-items:center;gap:var(--s2)}
h2.sec.tight{margin-top:0}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.chev{color:var(--muted);text-align:right}
/* A key sits before what it decodes; the pills wrap on their own rows at narrow widths. */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);font-size:12px;
  line-height:16px;color:var(--muted);margin-bottom:var(--s4)}
.mb-4{margin-bottom:var(--s4)}
.demo-journey{font-size:14px;line-height:20px;color:var(--muted)}
/* An inline icon sits on the text's middle, not its baseline. */
.demo-journey .ic,.fitem .ic,td .ic,.probe-out .ic{vertical-align:middle}
</style>
</head>
<body>
<div class="shell">
<aside>

      Cases</a>

      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M6 2v4M10 2v4M4 6h8v3a4 4 0 0 1-8 0zM8 13v2"/></svg>

      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M2 4h5M2 8h5M2 12h5M9 4h5M9 8h5M9 12h5"/><path d="M7 4l2 4-2 4" stroke-linejoin="round"/></svg>
      Field Map</a>

      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M8 2l5 2v4c0 3.5-2.2 5.4-5 6-2.8-.6-5-2.5-5-6V4z" stroke-linejoin="round"/></svg>
      Policy</a>

      Composer</a>

    <label><input type="checkbox" id="autorefresh"> refresh every 5 seconds</label>
  </div>
</aside>
<main><div class="page" id="page"><div class="loading">Loading…</div></div></main>
</div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NBSP=" ";
async function j(url,opts){const r=await fetch(url,opts);const body=await r.json().catch(()=>({}));
  if(!r.ok&&r.status>=500)throw new Error(`${r.status}: ${JSON.stringify(body).slice(0,300)}`);
  return{status:r.status,body}}
function toast(msg,ms=5000){const t=document.createElement("div");t.className="toast";
  t.setAttribute("role","status");t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const fmtExact=s=>s?new Date(s).toLocaleString(undefined,{hour12:false}):"—";
function rel(s){if(!s)return"—";const d=new Date(s),now=Date.now(),sec=(now-d)/1e3;
  if(sec<50)return"just now";if(sec<3600)return`${Math.round(sec/60)}m ago`;
  if(sec<86400)return`${Math.round(sec/3600)}h ago`;
  if(sec<172800)return"yesterday";return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
const when=s=>`<span class="when" title="${esc(fmtExact(s))}">${esc(rel(s))}</span>`;

/* Remembering the last case id or search term is a convenience, never a requirement. A browser
   set to block site data throws on the sessionStorage ACCESSOR itself, which took the whole view
   down through the error boundary; these degrade to "forget it" instead. */
const remember=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){/* not storable; fine */}};
const recall=(k,d="")=>{try{return sessionStorage.getItem(k)??d}catch(e){return d}};

/* Status icons.
   These are SVG, not characters, because the brand face ships a 291-glyph latin subset: ✓ ✕ ⏳
   → and friends are ABSENT from it and would silently fall back to a system font mid-word, which
   is exactly the mismatch the subset note in the brand pack warns about. Drawing them keeps every
   rendered glyph inside the subset AND gives status a non-colour cue, which colour-blind readers
   need and the contrast gates assume. One geometry (16-box, 1.75 stroke, currentColor) so they
   inherit their pill's ink; sized by .ic against the local font-size. */
const ic=d=>`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25"`
  +` stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${d}</svg>`;

/* ── Plain English ────────────────────────────────────────────────────────────
   The database speaks in enum values — approve_buy_locked, locked_org_id_required,
   RESOLVE_INPUTS. The screen speaks in sentences. Every raw identifier a person reads gets a
   readable name here, and the raw value stays within reach next to it (a mono subtitle, the
   pill's own explainer, a title attribute) because whoever is fixing the case still has to
   grep the logs for it. Translating is a PRESENTATION job: nothing below changes what the
   engine computes, stores, or sends on the callback. */
const SAY={

    manual_review_insufficient:"On hold",reject:"Rejected"},
  buy:{enabled:"buying: allowed",locked_org_id_required:"buying: locked until an org ID checks out"},
  buy_status:{not_applicable:"Buying not in play yet",
    buy_locked_org_id_required:"Buying locked until an org ID checks out",
    org_id_validation_pending:"Checking the org ID",org_id_failed:"Org ID did not check out",
    buy_enabled:"Buying enabled",buy_suspended:"Buying suspended"},
  case_status:{registered:"Signed up",email_verification_pending:"Waiting on email confirmation",
    email_verified:"Email confirmed",enrichment_running:"Gathering evidence",
    kyc_pending:"Checks in progress",manual_review_insufficient:"Waiting for more evidence",
    account_approved:"Approved",approved_manual:"Approved by a person",rejected:"Rejected"},
  broker:{clear:"Not a broker",allowed_broker:"Known broker, allowed",blocked:"Blocked broker"},
  check:{verified_company_email:"Company email confirmed",
    official_registry_match:"Found in the official company register",
    org_id_match:"Org ID matches the company",
    poc_verified:"Contact listed on the address record confirmed",
    business_document_verified:"Business document checks out",
    linkedin_company_match:"Person matches the company on LinkedIn",
    website_verified:"Website checked by a person",verified_email:"Some email confirmed"},
  status:{pass:"Passed",fail:"Failed",needs_review:"Needs a look",missing:"Nothing yet"},
  gate:{score_met:"Enough evidence points",legal_proof:"The company is real",
    control_proof:"The applicant controls it",broker_ok:"Not a blocked broker",
    no_hard_conflict:"Nothing contradicts"},
  /* Short on purpose: ten of these sit side by side in one table cell. The long version is in
     the Runs explainer. */
  stage:{QUEUED:"Queued",RESOLVE_INPUTS:"Read case",BROKER_GATE:"Broker check",
    RUN_ADAPTERS:"Call sources",VALIDATE:"Check replies",WRITE_CHECKS:"Record evidence",
    SCORE:"Score",DECIDE:"Decide",PUBLISH_DECISION:"Publish",COMPLETE:"Done",FAILED:"Failed"},
  task:{website:"Website review",poc_email_unavailable:"No contact email on file"},
  category:{control_proof:"Proves control",legal_business_proof:"Proves the company is real",
    supporting:"Supporting",account_access:"Account access"},
  mode:{automated:"Automatic",manual:"A person decides",
    automated_plus_user_token:"Automatic, plus an emailed code"},
  adapter:{broker_policy:"Blocked-broker list",email_verification:"Email confirmation",

    rir_poc:"Address registry contacts",document_ocr:"Document reader",
    website_manual_review:"Website review by a person"},

/* Unknown values must still read as something: an enum added upstream shows as spaced words
   rather than vanishing. */
const say=(g,k,fb)=>SAY[g]?.[k]??fb??String(k??"").replace(/_/g," ");

  caselist:{t:"Reading this table",b:`<p>Two different numbers, on purpose.</p><dl>
    <dt>Decision points</dt><dd>The score at the moment the verdict was published. This is the

    <p>The sync is one-way and platform-owned: the tool computes, the platform writes.</p>`},

    <p>Read-only here. Changing them is a deliberate, reviewed release.</p>`},

    call.</p>

    <p>Blocked rejects immediately. Allowed only tags the case.</p>`},

const tip=k=>{const x=TIPS[k];return x?`<button type="button" class="tipbtn" data-tip="${esc(k)}"`
  +` aria-label="What is this? ${esc(x.t)}">${I.help}</button>`:""};
const tipEl=$("#tip");
let tipFor=null;
function hideTip(){if(!tipFor)return;tipFor.removeAttribute("aria-describedby");
  tipFor=null;tipEl.hidden=true}
// fixed position, so viewport coordinates go straight on: above the trigger when there is room,
// below when there is not, and always inside the window's own gutters.
function placeTip(btn){
  const r=btn.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight,pad=8;
  tipEl.style.left=Math.round(Math.min(Math.max(pad,r.left+r.width/2-w/2),
    Math.max(pad,innerWidth-w-pad)))+"px";
  tipEl.style.top=Math.round(r.top-h-pad>=pad?r.top-h-pad:r.bottom+pad)+"px";
}
function showTip(btn){
  const x=TIPS[btn.dataset.tip];if(!x)return;
  tipFor=btn;btn.setAttribute("aria-describedby","tip");
  tipEl.innerHTML=`<b>${esc(x.t)}</b>${x.b}`;
  tipEl.hidden=false;
  placeTip(btn);
}
document.addEventListener("pointerover",e=>{const b=e.target.closest?.(".tipbtn");
  if(b&&b!==tipFor){hideTip();showTip(b)}});
document.addEventListener("pointerout",e=>{if(e.target.closest?.(".tipbtn")===tipFor)hideTip()});
document.addEventListener("focusin",e=>{const b=e.target.closest?.(".tipbtn");
  if(b){hideTip();showTip(b)}else hideTip()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});
/* Scrolling to reach a trigger is the normal way to reach one, so the bubble follows its trigger
   rather than vanishing — dismissing on scroll made an explainer near the fold impossible to
   read, because bringing it into view was itself the thing that closed it. */
const followTip=()=>{if(!tipFor)return;tipFor.isConnected?placeTip(tipFor):hideTip()};
addEventListener("scroll",followTip,true);
addEventListener("resize",followTip);
/* The pill's default label is the plain-English one. Where a caller passes its own label it
   wins, so the raw value is still one argument away wherever an operator needs to see it. */
const PILL={
  pass:["p-green",I.check,"Passed"],fail:["p-red",I.cross,"Failed"],needs_review:["p-amber",I.warn,"Needs a look"],
  missing:["p-neutral",I.absent,"Nothing yet"],
  approve:["p-green",I.check,"Approved"],approve_buy_locked:["p-amber",I.lock,"Approved, buying locked"],
  manual_review_insufficient:["p-amber",I.clock,"On hold"],reject:["p-red",I.cross,"Rejected"],
  /* Not a decision the engine can make: the published word for a computed approval the safety
     overlay held back. The person icon is the cue — this one waits on somebody, not on evidence. */
  held_for_approval:["p-amber",I.person,"Held for approval"],
  live:["p-green",I.live,"Real service"],stub:["p-amber",I.stub,"Test data"],dev:["p-amber",I.stub,"Stand-in"],
  "needs-config":["p-red",I.gear,"Missing credentials"],manual:["p-blue",I.person,"A person decides"],
  open:["p-amber",I.clock,"Waiting"],done:["p-green",I.check,"Done"],
  delivered:["p-green",I.check,"Delivered"],pending:["p-amber",I.clock,"Not sent yet"],
  dead:["p-red",I.dead,"Gave up"],queued:["p-neutral",I.clock,"Queued"],running:["p-accent",I.running,"Running"],
  integrity_drift:["p-red",I.warn,"Records disagree"],
  clear:["p-green",I.check,"Not a broker"],allowed_broker:["p-amber",I.warn,"Known broker, allowed"],
  blocked:["p-red",I.cross,"Blocked broker"],

const PROV_PILL={unresolved_pointer_drift:["integrity_drift",undefined],unresolved_legacy_order:["missing","Order unclear (old records)"],no_decisions:["missing","No verdict yet"],no_manual_decisions:["missing","Nobody approved by hand"],latest_manual_row:["manual","Approved by a person"],
  // every MANUAL provenance state has its own pill (re-audit `8377440` F6): a legacy-unresolved
  // manual history must NOT render identically to "no manual approval".
  latest_manual_row_manual:["manual","Approved by a person — this is the live one"],unresolved_pointer_drift_manual:["integrity_drift","Manual approval records disagree"],unresolved_legacy_order_manual:["missing","Manual order unclear (old records)"],no_manual_decisions_manual:["p-neutral","Nobody approved by hand"]};
const provPill=(p,manual)=>{const k=manual?p+"_manual":p;const[q,label]=PROV_PILL[k]||PROV_PILL[p]||["missing",p];return pill(q,label)};
const pill=(k,label)=>{const[c,i,d]=PILL[k]||["p-neutral",I.absent,k];
  return`<span class="pill ${c}">${i}${esc(label??d)}</span>`};

const RUN_STATES=["QUEUED","RESOLVE_INPUTS","BROKER_GATE","RUN_ADAPTERS","VALIDATE","WRITE_CHECKS","SCORE","DECIDE","PUBLISH_DECISION","COMPLETE"];
/* The steps read as short verbs, with the engine's own state name on the title so anyone
   matching a log line to a step still can. */
function pipe(state){if(state==="FAILED")return`<span class="pipe">`
  +`<span class="st fail" title="FAILED">Failed</span></span>`;
  const i=RUN_STATES.indexOf(state);
  return`<span class="pipe">`+RUN_STATES.map((s,k)=>
    `<span class="st ${k<i?"done":k===i?"cur":""}" title="${esc(s)}">${esc(say("stage",s))}</span>`
  ).join(`<span class="arr" aria-hidden="true">›</span>`)+`</span>`}

const page=$("#page");
let refreshTimer=null;

const sec=(title,tk="",cls="")=>`<h2 class="sec ${cls}">${title}${tip(tk)}</h2>`;
const emptyRow=(cols,head,body)=>`<tr><td colspan="${cols}"><div class="empty"><b>${head}</b>${body}</div></td></tr>`;

async function sidebarBadge(){try{
  // Use the UI's own endpoint, NOT the platform-HMAC-gated /v1/metrics: the console sends no
  // signature, so polling /v1/metrics under read-auth wrote a "rejected" row per poll (re-audit F1).
  const{body:o}=await j("/ui/api/overview");
  const m=o.metrics||{};
  const dead=(m.jobs_by_status?.dead??0)+(m.outbox_by_status?.dead??0);
  const b=$("#deadbadge");b.hidden=!dead;b.textContent=dead;
}catch(e){/* sidebar badge is best-effort */}}

/* ── Overview ─────────────────────────────────────────── */
async function viewOverview(){
  const{body:o}=await j("/ui/api/overview");
  $("#policychip").textContent="policy "+o.policy.bundle_hash.slice(0,10)+"…";
  $("#envchip").innerHTML=o.config.auth_disabled?pill("needs-config","Auth disabled"):pill("live","HMAC auth");
  const m=o.metrics,g=(x,k)=>x?.[k]??0;
  const deadJ=g(m.jobs_by_status,"dead"),deadO=g(m.outbox_by_status,"dead"),dead=deadJ+deadO;
  const reviews=Object.entries(m.review_tasks_open_by_type||{});
  const kpi=(lab,num,foot,cls="")=>`<div class="kpi"><div class="lab">${lab}</div>
    <div class="num ${cls}">${num}</div><div class="foot">${foot}</div></div>`;
  const decisions=Object.entries(m.decisions_by_type||{}).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<tr><td>${pill(k)}</td><td class="num strong">${v}</td></tr>`).join("")
    ||emptyRow(2,"No verdicts yet","Send a <code>kyb.run_requested</code> from the <a href='#/composer'>Composer</a>");
  const adapters=(m.adapter_latency||[]).map(a=>`<tr>
    <td><span class="strong">${esc(say("adapter",a.adapter_id))}</span>
      <div class="sub mono">${esc(a.adapter_id)}</div></td><td class="num">${a.calls}</td>
    <td class="num" ${a.error_rate>0?'style="color:var(--red)"':""}>${(a.error_rate*100).toFixed(0)}%</td>
    <td class="num">${a.p95_ms.toFixed(0)}${NBSP}ms</td></tr>`).join("")
    ||emptyRow(4,"Nothing called yet","Outside services appear here the first time a check runs");
  const deadRows=(list,kind)=>list.map(d=>`<tr>
    <td class="num">${d.id}</td><td class="mono">${esc(d.kind)}</td>
    <td>${d.case_id?caseLink(d.case_id):"—"}</td><td class="num">${d.attempts}</td>
    <td class="mono" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${esc(d.last_error||"")}">${esc(d.last_error||"")}</td>
    <td style="text-align:right"><button class="sm" data-requeue="${kind}:${d.id}">Try again</button></td></tr>`).join("");

  page.innerHTML=tbar("Overview","How the tool itself is doing — what is moving, what is stuck, and how it is set up","","overview")+`
    ${dead?`<div class="banner">${I.dead}<span>${dead} thing${dead>1?"s":""} gave up after every retry and need${dead>1?"":"s"} a person — read the error, fix the cause, then try again below.</span></div>`:""}
    ${sec("At a glance","kpis","tight")}
    <div class="kpis">
      ${kpi("Runs finished",g(m.runs_by_state,"COMPLETE"),"got all the way through")}
      ${kpi("Waiting to run",g(m.jobs_by_status,"queued")+g(m.jobs_by_status,"running"),"queued or in progress")}
      ${kpi("Gave up",dead,dead?"needs a person":"nothing stuck",dead?"bad":"")}
      ${kpi("Results not sent yet",g(m.outbox_by_status,"pending"),"a number that keeps climbing means the sender has stalled")}
      ${kpi("Waiting on a person",reviews.reduce((a,[,v])=>a+v,0),esc(reviews.map(([k,v])=>`${v} ${say("task",k).toLowerCase()}${v===1?"":"s"}`).join(" · "))||"nothing in the queue")}
      ${kpi("Event to decision",(m.event_to_decision_seconds?.p95??0).toFixed(1)+"s","slowest one in twenty · target under 10s")}
    </div>
    <div class="split">
      <div class="card"><div class="hd"><h2>Decisions so far</h2><span class="hint">since day one</span>${tip("decisions")}</div>
        <div class="bd flush"><table><tbody>${decisions}</tbody></table></div></div>
      <div class="card"><div class="hd"><h2>Outside services</h2><span class="hint">how they are answering</span>${tip("latency")}</div>
        <div class="bd flush"><table>
          <thead><tr><th>Service</th><th class="num">Calls</th><th class="num" title="share of calls that came back as an error">Errors</th>
          <th class="num" title="the slowest one call in twenty">Slowest</th></tr></thead>
          <tbody>${adapters}</tbody></table></div></div>
    </div>
    ${o.dead_jobs.length?sec("Work that gave up","deadjobs")+`<div class="card"><div class="bd flush"><table>
      <thead><tr><th class="num">ID</th><th>What it was</th><th>Case</th><th class="num">Tries</th><th>Last error</th><th></th></tr></thead>
      <tbody>${deadRows(o.dead_jobs,"job")}</tbody></table></div></div>`:""}
    ${o.dead_outbox.length?sec("Results that never reached the platform","deadoutbox")+`<div class="card"><div class="bd flush"><table>
      <thead><tr><th class="num">ID</th><th>What it was</th><th>Case</th><th class="num">Tries</th><th>Last error</th><th></th></tr></thead>
      <tbody>${deadRows(o.dead_outbox,"outbox")}</tbody></table></div></div>`:""}
    ${sec("How this copy is set up","config")}
    <div class="card"><div class="bd kv">
      <span class="k">Rulebook fingerprint</span><span class="mono">${esc(o.policy.bundle_hash)}</span>
      <span class="k">Scoring</span><span>version ${esc(o.policy.rubric_version)} · ${o.policy.threshold} points to approve</span>
      <span class="k">Results are sent to</span><span class="mono">${esc(o.config.callback_url)}</span>
      <span class="k">Shared signing key</span><span>${o.config.hmac_secret_set?pill("live","Set"):pill("needs-config","Missing")}</span>
      <span class="k">Evidence files</span><span>${esc(o.config.object_store)}</span>
      <span class="k">Rules loaded from</span><span class="mono">${esc(o.config.policy_dir)}</span>
    </div></div>`;
  page.querySelectorAll("[data-requeue]").forEach(b=>b.onclick=async()=>{
    const[kind,id]=b.dataset.requeue.split(":");
    const r=await j(`/ui/api/requeue/${kind}/${id}`,{method:"POST"});
    toast(r.status<300?`${I.check}<span>Put back in the queue to try again</span>`:`${I.cross}<span>${esc(JSON.stringify(r.body.detail??r.body))}</span>`);
    route()});
}

        <input id="q" placeholder="Search by company or ID…" value="${esc(q)}" aria-label="search cases"></div>
      <span class="note">${body.cases.length} compan${body.cases.length===1?"y":"ies"}</span>
      ${tip("caselist")}</div>
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Company</th><th>Verdict</th><th class="num" title="the score the published verdict was made on">Decision points</th>
      <th class="num" title="what today's evidence adds up to — this is not the verdict">Points now</th>

/* ── Case detail ──────────────────────────────────────── */
function humanizeAudit(a){
  const d=a.detail_json||{};
  switch(a.action){
    case"event.received":return`the platform sent <b>${esc(d.event_type||"?")}</b>`;
    case"run.created":return`started a round of checks`;
    case"run.broker_gate":return`checked the blocked-broker list ${I.arrow} <b>${esc(say("broker",d.broker_status))}</b>${d.short_circuit?" · stopped here":""}`;
    case"adapter.recorded":return`asked <b>${esc(say("adapter",d.adapter_id))}</b> · ${esc(d.status==="ok"?"answered":say("status",d.status))} · ${d.latency_ms??0}ms`;
    case"check.created":return`<b>${esc(say("check",d.check_type))}</b> ${I.arrow} ${esc(say("status",d.status))}${d.points?` · +${d.points} points`:""}`;
    case"check.superseded":return`<b>${esc(say("check",d.check_type))}</b> replaced by fresher evidence`;
    case"review_task.created":return`opened a job for a person \u2014 <b>${esc(say("task",d.task_type))}</b>`;
    case"review_task.completed":return`a person answered · <b>${esc(say("status",d.result,d.result))}</b>`;
    case"poc.token_sent":return`emailed a code to the registry contact for <b>${esc(d.poc_handle)}</b>`;
    case"run.decided":return d.enforcement_held
      ?`verdict: <b>Held for approval</b> · ${d.score} points · the rules said ${esc(say("decision",d.computed_decision))}, but this copy may not approve on its own`
      :`verdict: <b>${esc(say("decision",d.decision))}</b> · ${d.score} points`;
    case"reviewer.manual_approve":return`<b>a person approved this by hand</b>`;
    case"run.failed":return`the round of checks <b>failed</b> · ${esc((d.error||"").slice(0,80))}`;
    case"run.stage":case"run.inputs_resolved":return null; // noise — keep in raw only
    default:return`${esc(a.action)}`;
  }
}
const HOT=new Set(["run.decided","reviewer.manual_approve","check.superseded","run.failed"]);

/* The enforcement hold, said plainly. The word above this panel is what the platform was told;
   the panel says why that word is not the one the rulebook computed, and who can change it.
   Copy only: the score is the pointed row's own, the target is the rulebook's, and the hold
   itself is the server's word (enforcement_hold, from the engine's run.decided record) — the
   screen never decides a case is held by looking at five green gates. */
function holdCallout(hold,latest,threshold){
  const over=(latest.score??0)-threshold;
  const margin=over>0?`${over} point${over===1?"":"s"} over the target`:"exactly at the target";
  return`<div class="callout amber" role="note">${I.person}<div>
    <b>Every rule passed and the score is ${margin}, so the rulebook says
      <a href="#/policy?rule=${encodeURIComponent(hold.computed_decision)}">${esc(say("decision",hold.computed_decision))}</a>.</b>
    This copy of the tool may not approve on its own yet, so the platform was told On hold
    instead. That is an exception to the rule, not a reading of it. Only a named reviewer can
    lift it, by approving the case by hand, and the audit trail then carries their name. Letting
    the tool approve without a person is a release decision, not something done from here.
  </div></div>`}

async function viewCase(id){
  const{status,body:d}=await j(`/ui/api/cases/${encodeURIComponent(id)}/full`);
  if(status===404){page.innerHTML=`<div class="empty card"><b>No company with that ID</b><code>${esc(id)}</code></div>`;return}
  const c=d.case;
  // AUTHORITY: the trigger-maintained pointer row. decisions[] is decided_at-ordered for DISPLAY
  // only — transaction-start timestamps invert against commit order, and c.latest_decision goes
  // stale after a record-only manual approval, so neither may pick the verdict tuple.
  const latest=d.pointer_decision||{},gates=latest.gates_json||{};
  const s=d.score,live=s.current_evidence_score,max=Math.max(s.threshold*1.3,live+10);
  const decision=latest.decision??null;
  // The hold comes from the API (the engine's own run.decided record), never from the gates:
  // the screen shows the verdict, it does not compute one.
  const hold=d.enforcement_hold||null;
  const heldRuns=new Set(d.audit.filter(a=>a.action==="run.decided"&&a.detail_json?.enforcement_held)
    .map(a=>a.detail_json.run_id));
  // The bar is LIVE EVIDENCE and is styled neutrally on purpose: colouring it by the published
  // decision, or captioning it "threshold met", made one visual read out of two different
  // authority eras (re-audit cbb783b F6). The published tuple gets its own card below.
  const liveGap=s.threshold-live;
  const liveNote=liveGap>0?`${liveGap} points short of the target`:`past the target`;
  const decisionColor=decision==="approve"||decision==="approve_buy_locked"?"var(--green)":
                      decision==="reject"?"var(--red)":decision?"var(--amber)":"var(--faint)";
  const sdot=st=>st==="pass"?`<span class="sdot g">${I.check}</span>`:st==="fail"?`<span class="sdot r">${I.cross}</span>`:
    st==="needs_review"?`<span class="sdot a">!</span>`:`<span class="sdot n">·</span>`;
  const contrib=s.items.map(it=>`<div class="crow">${sdot(it.status)}
      <span class="nm" title="${esc(it.check_type)}"
        ${it.status==="missing"?'style="color:var(--muted)"':""}>${esc(say("check",it.check_type))}</span>
      <span class="pts ${it.awarded?"":"zero"}">${it.awarded?`+${it.awarded}`:"0"}</span>
      <span class="cap">/ ${it.points}</span></div>`).join("");

  const byType={};d.checks.forEach(ch=>(byType[ch.check_type]??=[]).push(ch));
  const chains=Object.entries(byType).map(([type,list])=>{
    const chain=list.map((ch,i)=>{
      const live=!ch.superseded_by_check_id;
      const reasons=(ch.reason_codes||[]).map(r=>`<span class="tag ${ch.status==="fail"?"err":"warn"}">${esc(r)}</span>`).join(" ");
      return`${i?`<span class="arr">${I.arrow}</span> `:""}<span ${live?"":'style="opacity:.55"'}
        title="${esc(ch.id)} · ${esc(fmtExact(ch.created_at))}">${pill(ch.status)}${live&&ch.points_awarded?` <b class="strong">+${ch.points_awarded}</b>`:""}</span> ${reasons}`;
    }).join(" ");
    return`<tr><td><span class="strong">${esc(say("check",type))}</span>
        <div class="sub mono">${esc(type)}</div></td><td>${chain}</td>
      <td class="sub">${esc(say("adapter",list.at(-1).source||""))}</td></tr>`;
  }).join("")||emptyRow(3,"No evidence yet","Evidence arrives with platform messages — try the <a href='#/composer'>Composer</a>");

  const runRows=d.runs.map(r=>{
    const ads=d.adapter_results.filter(a=>a.run_id===r.id).map(a=>
      `<span class="tag ${a.status==="upstream_error"?"err":""}" title="${esc(a.adapter_id)} · ${esc(a.status)}"
        >${esc(say("adapter",a.adapter_id))} · ${esc(a.status==="ok"?"answered":a.status==="upstream_error"?"failed":"not needed")}</span>`).join(" ");
    return`<tr><td class="mono">${esc(r.id.slice(0,8))}…${r.partial?` ${pill("needs_review","some sources failed")}`:""}</td>
      <td>${pipe(r.state)}${r.error?`<div class="sub" style="color:var(--red)">${esc(r.error)}</div>`:""}</td>
      <td>${ads||`<span class="sub">nothing was called — the broker check ended it</span>`}</td>
      <td class="num">${when(r.started_at)}</td></tr>`}).join("")
    ||emptyRow(4,"Nothing has run yet","Every platform message starts one round of checks");

  const taskRows=d.review_tasks.map(t=>`<tr>
    <td class="mono">${esc(t.id.slice(0,8))}…</td>
    <td title="${esc(t.task_type)}">${esc(say("task",t.task_type))}</td><td>${pill(t.status)}</td>
    <td>${t.result?pill(t.result):"—"}${t.reviewer_id?` <span class="sub">by ${esc(t.reviewer_id)}</span>`:""}</td>
    <td class="sub mono" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(t.context_json))}</td>
    <td style="text-align:right;white-space:nowrap">${t.status==="open"&&t.task_type==="website"?`
      <button class="sm good" data-complete="${esc(t.id)}:pass">${I.check}Looks genuine</button>
      <button class="sm danger" data-complete="${esc(t.id)}:fail">${I.cross}Does not</button>`:""}</td></tr>`).join("")
    ||emptyRow(6,"Nothing waiting on a person","A website review opens during a full round of checks");

  const tokenRows=d.poc_tokens.map(t=>{
    const state=t.verified_at?pill("pass","Code used"):
      (new Date(t.expired_at)<new Date()?pill("fail","Expired"):pill("pending","Sent, not used yet"));
    return`<tr><td class="mono">${esc(t.poc_handle)}</td><td class="mono">${esc(t.rir_listed_email)}</td>
      <td>${state}</td><td class="num">${when(t.sent_at)}</td></tr>`}).join("");

  const sfRows=Object.entries(d.salesforce).filter(([k])=>k!=="KYC_Check__c").map(([k,v])=>`<tr>
    <td class="mono">${esc(k)}</td>
    <td>${v===null||v===false&&k!=="Hard_Conflict__c"?`<span class="sub">—</span>`:`<span class="strong">${esc(String(v))}</span>`}</td>
    <td class="sub src">${esc(d.field_sources[k]||"")}</td></tr>`).join("");

  const fitems=d.audit.map(a=>{
    const line=humanizeAudit(a);if(line===null)return"";
    return`<div class="fitem ${HOT.has(a.action)?"hot":""}">
      <span class="obj">${line}</span>
      ${a.actor&&a.actor!=="system"?`<span class="who">${esc(a.actor)}</span>`:""}
      <details><summary>raw</summary><pre>${esc(JSON.stringify(a.detail_json,null,2))}</pre></details>
      ${when(a.at)}
    </div>`}).filter(Boolean);
  const FEED_TAIL=15;
  const feed=fitems.length===0?`<div class="empty"><b>No activity</b></div>`
    :fitems.length<=FEED_TAIL+5?fitems.join("")
    :`<div class="feed-earlier"><button class="sm" id="feedmore">Show ${fitems.length-FEED_TAIL} earlier entries</button></div>
      <div id="feedhead" hidden>${fitems.slice(0,-FEED_TAIL).join("")}</div>
      ${fitems.slice(-FEED_TAIL).join("")}`;

  page.innerHTML=`
    <div class="crumb"><a href="#/cases">Cases</a> / <span class="mono">${esc(c.id)}</span></div>
    ${tbar(esc(c.company_name||c.id),
      `<span class="chips">${decision?(hold?pill("held_for_approval"):pill(decision)):provPill(d.decision_provenance)}
       ${d.manual_decision_provenance&&d.manual_decision_provenance!=="no_manual_decisions"?provPill(d.manual_decision_provenance,true):""}
       ${c.status==="approved_manual"?pill("manual","Approved by a person"):`<span class="pill p-neutral" title="${esc(c.status)}">${esc(hold&&c.status==="manual_review_insufficient"?"Waiting for a reviewer":say("case_status",c.status))}</span>`}
       <span class="pill p-neutral" title="${esc(c.buy_status)}">${esc(say("buy_status",c.buy_status))}</span>${pill(c.broker_status)}</span>`,
      `<button class="primary" id="sendbtn">Send a message</button>`)}
    <div class="card"><div class="hd"><h2>Published decision</h2>
        <span class="hint">the verdict the platform was told — every number here comes from one single record</span>${tip("published")}</div>
      <div class="bd">
        ${latest.decision?`<div class="bullet"><div class="val">
            <b style="color:${decisionColor}" title="${esc(latest.decision)}${hold?` — the rules computed ${esc(hold.computed_decision)}`:""}">${hold?"Held for approval":esc(say("decision",latest.decision))}</b>
            <span class="of">${latest.score??"—"} points · ${esc(say("buy",latest.buy_enablement,"buying: not recorded"))}</span>
            <span class="verdict sub">decided ${esc(fmtExact(latest.decided_at))}</span></div></div>
          ${hold?holdCallout(hold,latest,s.threshold):""}
          <h3 class="sub-hd">Published decision hard gates
            <span class="gloss">— the five things that all had to be true</span>${tip("gates")}</h3>
          <div class="gates published-gates">${["score_met","legal_proof","control_proof","broker_ok","no_hard_conflict"]
            .map(g0=>g0 in gates
              ?`<div class="gate ${gates[g0]?"ok":"no"}" title="${esc(g0)}">${gates[g0]?I.check:I.cross}${esc(say("gate",g0))}</div>`
              :`<div class="gate na" title="${esc(g0)} — this verdict skipped the rule, which is what happens when a person approves by hand">· ${esc(say("gate",g0))} — not checked</div>`).join("")}</div>`
          :`<div class="sub">${d.decision_provenance==="unresolved_pointer_drift"?`<b>The records disagree.</b> This case points at a verdict the safety check refuses to accept \u2014 it belongs to another company, or it is gone. Nothing may be shown as the verdict until someone looks into it; the database has forbidden this state since migration 022.`:d.decision_provenance==="unresolved_legacy_order"?`No verdict can be shown: these records predate the ordering fix, so which one came last is genuinely unknown. The next decision settles it.`:`This company has no verdict yet.`}</div>`}
      </div></div>
    <div class="card"><div class="hd"><h2>Live evidence — not the published decision</h2>
        <span class="hint">what today's evidence adds up to right now · the mark is the target to approve</span>${tip("live")}</div>
      <div class="bd">
        <div class="bullet">
          <div class="val"><b>${live}</b><span class="of">of ${s.threshold} points needed</span>
            <span class="verdict sub">${liveNote}</span></div>
          <div class="btrack">
            <span class="bmeasure" style="width:${Math.min(100,live/max*100)}%;background:var(--muted)"></span>
            <span class="btick" style="left:${s.threshold/max*100}%"><span>${s.threshold} to approve</span></span>
          </div>
        </div>
        <div class="contrib">${contrib}</div>
      </div></div>
    ${sec("Evidence, and what replaced it","checks")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Kind of evidence</th><th>Oldest first — faded means replaced</th><th>Came from</th></tr></thead>
      <tbody>${chains}</tbody></table></div></div>
    ${sec("Rounds of checks","runs")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Round</th><th>How far it got</th><th>Services asked</th><th class="num">Started</th></tr></thead>
      <tbody>${runRows}</tbody></table></div></div>
    ${sec("Jobs for a person","tasks")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Job</th><th>What to do</th><th>State</th><th>Answer</th><th>Details</th><th></th></tr></thead>
      <tbody>${taskRows}</tbody></table></div></div>
    ${tokenRows?sec("Emailed codes","tokens")+`<div class="card"><div class="bd flush"><table>
      <thead><tr><th>Registry contact</th><th>Emailed to</th><th>State</th><th class="num">Sent</th></tr></thead>
      <tbody>${tokenRows}</tbody></table></div></div>`:""}
    ${sec("What Salesforce should show","salesforce")}
    <div class="card"><div class="hd"><h3>Fields the platform is expected to copy across</h3>
      <span class="hint">a preview only — this tool never writes to Salesforce</span></div>
      <div class="bd flush"><table>
      <thead><tr><th>Salesforce field</th><th>Value</th><th>Where it comes from</th></tr></thead>
      <tbody>${sfRows}</tbody></table></div>
      <div class="bd" style="border-top:1px solid var(--line)">
        <details><summary>
          One row per check (${d.salesforce.KYC_Check__c.length})</summary>
        <pre>${esc(JSON.stringify(d.salesforce.KYC_Check__c,null,2))}</pre></details></div></div>
    ${sec("Every verdict, in order","history")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Verdict</th><th class="num">Points</th><th>Buying</th><th>By hand</th>
      <th class="num">Decided</th><th class="num">Platform told</th></tr></thead>
      <tbody>${d.decisions.map(x=>`<tr><td>${heldRuns.has(x.run_id)?pill("held_for_approval"):pill(x.decision)}</td><td class="num strong">${x.score}</td>
        <td class="sub">${esc(say("buy",x.buy_enablement))}</td><td>${x.manual?`<span class="iw">${I.person}${esc(x.reviewer_id||"")}</span>`:"—"}</td>
        <td class="num">${when(x.decided_at)}</td><td class="num">${when(x.published_at)}</td></tr>`).join("")
        ||emptyRow(6,"No verdict yet","")}</tbody></table></div></div>
    ${sec("What happened, step by step","activity")}
    <div class="card"><div class="bd"><div class="feed">${feed}</div></div></div>
    ${sec("What the applicant sent","submitted")}
    <div class="card"><div class="bd">
      <details open><summary>The original details, exactly as received</summary>
      <pre>${esc(JSON.stringify(c.submitted_json,null,2))}</pre></details></div></div>`;

  $("#sendbtn").onclick=()=>{remember("composerCase",c.id);location.hash="#/composer"};
  const fm=$("#feedmore");if(fm)fm.onclick=()=>{$("#feedhead").hidden=false;fm.parentElement.remove()};
  page.querySelectorAll("[data-complete]").forEach(b=>b.onclick=async()=>{
    const[taskId,result]=b.dataset.complete.split(":");
    const r=await j(`/ui/api/send-event`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({case_id:c.id,event_type:"website.review_completed",
        idempotency_key:"review-task-complete-"+taskId,
        payload:{task_id:taskId,result,reviewer_id:"ops-console",reason_codes:[]}})});
    toast(r.status<300?`${I.check}<span>Answer recorded — the case will be scored again in a moment</span>`:`${I.cross}<span>${esc(JSON.stringify(r.body.detail))}</span>`);
    setTimeout(route,700)});
}

/* ── Integrations ─────────────────────────────────────── */
const GLYPH={broker_policy:"BR",email_verification:"EM",companies_house:"CH",gleif:"GL",
  floqer_company_enrichment:"FL",rir_rdap:"RD",rir_poc:"PC",document_ocr:"DO",website_manual_review:"WW"};
async function viewIntegrations(){
  const{body:d}=await j("/ui/api/integrations");
  const p=d.platform_callback;
  const envChips=list=>list.map(e=>
    `<span class="tag ${e.present?"":"warn"}">${e.present?I.check:I.absent}${esc(e.note)}</span>`).join(" ");
  const rows=d.adapters.map(a=>`
    <div class="irow">
      <div class="itile">${GLYPH[a.adapter_id]||"·"}</div>
      <div class="meta">
        <div class="nm">${esc(say("adapter",a.adapter_id))} ${pill(a.status)}</div>
        <div class="kind mono">${esc(a.adapter_id)}</div>
        <div class="kind">${esc(a.kind)} — ${esc(a.detail)}</div>
        <div class="facts">
          ${a.env.length?`<span>${envChips(a.env)}</span>`:""}
          ${a.stats?`<span>${a.stats.calls} calls · ${(a.stats.error_rate*100).toFixed(0)}% err · p95 ${a.stats.p95_ms.toFixed(0)}ms · last ${esc(rel(a.stats.last_call_at))}</span>`
            :`<span>never called</span>`}
        </div>
        ${a.todo?`<div class="todo">! ${esc(a.todo)}</div>`:""}
      </div>
      <div class="end">${a.probeable?`<button class="sm" data-probe="${esc(a.adapter_id)}">Test it</button>
        <div class="probe-out" id="probe-${esc(a.adapter_id)}"></div>`:`<span class="sub">cannot be tested from here</span>`}</div>
    </div>`).join("");
  page.innerHTML=tbar("Integrations","Where each piece of evidence comes from, and whether it is real yet","","integrations")+`
    <p class="legend">${pill("live")} answers from the real service · ${pill("stub")} answers from built-in test data ·
      ${pill("dev")} a stand-in written for development · ${pill("needs-config")} wired up but has no key yet ·
      ${pill("manual")} a person does this, by design</p>
    <div class="card mb-4"><div class="hd"><h2 class="iw">${I.swap}Between the platform and the tool</h2>${tip("platform")}</div>
      <div class="irow"><div class="itile">CB</div>
        <div class="meta"><div class="nm">Sending decisions back ${pill(p.status)}</div>
          <div class="kind">Posted to the platform and signed, so it can prove the message came from here.
            Sent at least once; a repeat of the same case and round is safe to ignore.</div>
          <div class="facts"><span>${p.callback_url_is_default_stub?`<span class="tag warn">${I.absent}still the placeholder address</span>`:`<span class="tag">${I.check}address set</span>`}
            <span class="tag ${p.hmac_secret_set?"":"warn"}">${p.hmac_secret_set?I.check:I.absent}shared signing key</span>
            ${p.auth_disabled?`<span class="tag err">! anyone can post to this tool</span>`:""}</span></div>
          ${p.todo?`<div class="todo">! ${esc(p.todo)}</div>`:""}</div></div>
      <div class="irow"><div class="itile">${I.mail}</div>
        <div class="meta"><div class="nm">Emailing one-time codes ${pill(d.email_sender.status)}</div>
          <div class="kind">${esc(d.email_sender.detail)}</div>
          <div class="todo">! ${esc(d.email_sender.todo)}</div></div></div>
      <div class="irow"><div class="itile">S3</div>
        <div class="meta"><div class="nm">Where evidence files are kept ${pill("live",d.object_store.kind)}</div>
          <div class="kind mono">${esc(d.object_store.root)}</div></div></div>
    </div>
    <div class="card"><div class="hd"><h2>Evidence sources</h2><span class="hint">nine of them, in the order the rules list them</span>${tip("adapters")}</div>${rows}</div>
`;
  page.querySelectorAll("[data-probe]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent="Testing…";
    const{body}=await j(`/ui/api/integrations/${b.dataset.probe}/probe`,{method:"POST"});
    const out=$(`#probe-${CSS.escape(b.dataset.probe)}`);
    out.innerHTML=body.targets
      ?Object.entries(body.targets).map(([k,v])=>
        `${v.reachable?I.check:I.cross} ${esc(k)} · ${esc(v.note||v.error||(v.reachable?"answered":"no answer"))} · ${v.latency_ms}ms`).join("<br>")
      :esc(body.note||"");
    b.disabled=false;b.textContent="Test it"});
}

/* ── Field Map ────────────────────────────────────────── */
async function viewFieldMap(){
  const{body:pol}=await j("/ui/api/policy");
  const{body:cl}=await j("/ui/api/cases?limit=100");
  const selected=recall("fmCase")||cl.cases[0]?.id||"";
  let values={};
  if(selected){const r=await j(`/ui/api/cases/${encodeURIComponent(selected)}/full`);
    if(r.status<300)values=r.body.salesforce}
  const rows=Object.entries(pol.field_sources).map(([field,src])=>{
    const v=values[field];
    const shown=field==="KYC_Check__c"?(v?`${v.length} child record(s)`:""):
      (v===undefined||v===null?"":String(v));
    return`<tr><td class="mono">${esc(field)}</td>
      <td>${selected?(shown===""?`<span class="sub">—</span>`:`<span class="strong">${esc(shown)}</span>`)
        :`<span class="sub">pick a case</span>`}</td>
      <td class="sub src">${esc(src)}</td></tr>`}).join("");
  page.innerHTML=tbar("Salesforce field map",
    "Which Salesforce field each fact lands in, and which part of the tool decides it","","fieldmap")+`
    <div class="toolbar">
      <label class="note" for="fmcase">Show real values for</label>
      <select id="fmcase"><option value="">— no company —</option>
        ${cl.cases.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?"selected":""}>${esc(c.company_name||c.id)} · ${esc(c.id)}</option>`).join("")}
      </select>${tip("fieldtable")}</div>
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th style="width:250px">Salesforce field</th><th style="width:250px">Value for the chosen company</th>
      <th>Where it comes from</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <p class="sub" style="margin-top:12px">The tool works out these values; the platform writes them.
      Each case is written in order, and writing the same result twice is harmless. If Salesforce is
      down, decisions still happen here — only the copy in Salesforce waits.</p>`;
  $("#fmcase").onchange=e=>{remember("fmCase",e.target.value);viewFieldMap()};
}

/* ── Policy ───────────────────────────────────────────── */
async function viewPolicy(rule=""){
  const{body:p}=await j("/ui/api/policy");
  const rubric=p.rubric.map(r=>`<tr>
    <td><span class="strong">${esc(say("check",r.check_type))}</span>
      <div class="sub mono">${esc(r.check_type)}</div></td><td class="num strong">+${r.points}</td>
    <td class="sub">${esc(say("category",r.category))}</td>
    <td>${r.mode==="manual"?pill("manual"):`<span class="sub">${esc(say("mode",r.mode))}</span>`}</td>
    <td class="sub">${esc(r.pass_rule)}</td></tr>`).join("");
  /* The condition is shown verbatim, in the mono register, because it IS the rule: restating a
     compliance condition in prose on screen would let the screen drift from the bundle and assert
     something the engine does not do. The plain reading lives in this section's explainer, where
     it is clearly a reading and not the authority. */
  // Every row is addressable (#/policy?rule=<decision>) so a case page can point at the exact
  // rule that produced its verdict; the pointed row is tinted and takes focus.
  const decisions=p.decisions.map(d0=>`<tr id="rule-${esc(d0.decision)}"${d0.decision===rule?' class="hl" tabindex="-1"':""}><td class="num">${d0.priority}</td><td>${pill(d0.decision)}</td>
    <td class="sub mono">${esc(d0.condition)}</td><td class="sub">${esc(String(d0.platform_enforcement).replace(/_/g," "))}</td></tr>`).join("");
  const brokers=p.broker_entities.map(b=>{
    const ids=["aliases","domains","email_domains","org_ids","poc_handles","asns"]
      .flatMap(k=>(b[k]||[]).map(v=>`<span class="tag">${esc(v)}</span>`)).join(" ");
    return`<tr><td class="strong">${esc(b.name)}</td>
      <td>${b.policy==="blocked"?pill("blocked","Blocked — rejected on sight"):pill("clear","Allowed — only tagged")}</td>
      <td>${ids||`<span class="sub">name only — anything else has to be added to the list directly</span>`}</td></tr>`}).join("");
  page.innerHTML=tbar("Policy","The rules the engine actually runs — this page is the rulebook, not a description of it",
      `<span class="tag" title="fingerprint of the whole rulebook">${esc(p.bundle_hash.slice(0,16))}…</span>`,"policy")+`
    <div class="card"><div class="hd"><h3>How points are earned</h3><span class="hint">${p.threshold} points to approve · only the newest evidence of each kind counts</span>${tip("rubric")}</div>
      <div class="bd flush"><table>
      <thead><tr><th>Evidence</th><th class="num">Points</th><th>Proves</th><th>Who checks</th><th>What has to be true — no judgement calls</th></tr></thead>
      <tbody>${rubric}</tbody></table></div></div>
    ${sec("How the verdict is chosen — first match wins","decisionpolicy")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th class="num">#</th><th>Verdict</th><th>When it applies</th><th>What the platform does</th></tr></thead>
      <tbody>${decisions}</tbody></table></div>
      <p class="sub" style="margin:0;padding:var(--s3) var(--s4);border-top:1px solid var(--line)">
        A case page that reads <b>Held for approval</b> matched an Approved row and was still
        published as On hold: this copy of the tool may not approve on its own. That hold is an
        exception to this table, not a row in it, and only a named reviewer lifts it.</p></div>
    ${sec("The blocked-broker list — exact matches only","brokerpolicy")}
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Company</th><th>Treatment</th><th>What counts as a match — names, domains, org IDs, contacts, networks</th></tr></thead>
      <tbody>${brokers}</tbody></table></div></div>
    ${sec("The five rules, as stored","hardgates")}
    <div class="card"><div class="bd"><pre style="margin:0">${esc(JSON.stringify(p.hard_gates,null,2))}</pre></div></div>
    ${sec("Messages the tool accepts","events")}
    <div class="card"><div class="bd chips">${p.events.map(e=>`<span class="tag">${esc(e)}</span>`).join("")}</div></div>`;
  if(rule){const row=page.querySelector("#rule-"+CSS.escape(rule));
    if(row){row.scrollIntoView({block:"center"});row.focus({preventScroll:true})}}
}

/* ── Composer ─────────────────────────────────────────── */
async function viewComposer(){
  const{body:t}=await j("/ui/api/event-templates");
  const caseId=recall("composerCase")||"demo-case-001";
  page.innerHTML=tbar("Composer","Send a platform message by hand — the tool signs it and stops it counting twice","","composer")+`
    <div class="split">
      <div class="card"><div class="hd"><h3>The message</h3>${tip("composerevent")}</div><div class="bd">
        <div class="field"><label class="flab" for="c-case">Which company</label>
          <input id="c-case" value="${esc(caseId)}">
          <span class="note">the platform's ID for the case — an unknown one creates a new case</span></div>
        <div class="field"><label class="flab" for="c-type">What happened</label>
          <select id="c-type">${t.event_types.map(e=>`<option ${e==="kyb.run_requested"?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
        <div class="field"><label class="flab" for="c-payload">The details</label>
          <textarea id="c-payload" spellcheck="false"></textarea>
          <span class="note">filled in with a working example — edit it as you like</span></div>
        <div class="toolbar" style="margin:0">
          <button class="primary" id="c-send">Send it</button>
          <span class="note">the background worker has to be running for anything to happen next</span></div>
      </div></div>
      <div class="stack">
        <div class="card"><div class="hd"><h3>What came back</h3>${tip("composerresult")}</div><div class="bd">
          <pre id="c-out" style="margin:0">—</pre>
          <div class="sub" id="c-hint" style="margin-top:8px"></div></div></div>
        <div class="card"><div class="hd"><h3>A worked example</h3>${tip("demo")}</div><div class="bd demo-journey">
          The built-in test data recognises <span class="strong">Acme Networks Ltd</span>. These three,
          in order: <code>kyb.run_requested</code> ${I.arrow} <code>email.verified</code> ${I.arrow}
          <code>org_id.submitted</code> (ORG-ACME-1) take a case all the way to
          ${pill("approve")}. Answer the website job on the case page for another 10 points.</div></div>
      </div>
    </div>`;
  const fill=()=>$("#c-payload").value=JSON.stringify(t.templates[$("#c-type").value]??{},null,2);
  $("#c-type").onchange=fill;fill();
  $("#c-send").onclick=async()=>{
    let payload;try{payload=JSON.parse($("#c-payload").value||"{}")}
    catch(e){toast(`${I.cross}<span>The details box is not valid JSON</span>`);return}
    const r=await j("/ui/api/send-event",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({case_id:$("#c-case").value.trim(),event_type:$("#c-type").value,payload})});
    $("#c-out").textContent=`HTTP ${r.status}\n`+JSON.stringify(r.body,null,2);
    remember("composerCase",$("#c-case").value.trim());
    if(r.status<300)$("#c-hint").innerHTML=
      `Started <span class="strong">${r.body.jobs_queued}</span> piece${r.body.jobs_queued===1?"":"s"} of work — open ${caseLink($("#c-case").value.trim())} to watch it happen`;
  };
}

/* ── Router ───────────────────────────────────────────── */
const routes=[
  [/^#\/overview$/,()=>viewOverview(),"overview"],
  [/^#\/cases$/,()=>viewCases(),"cases"],
  [/^#\/case\/(.+)$/,m=>viewCase(decodeURIComponent(m[1])),"cases"],
  [/^#\/integrations$/,()=>viewIntegrations(),"integrations"],
  [/^#\/fieldmap$/,()=>viewFieldMap(),"fieldmap"],
  [/^#\/policy(?:\?rule=([^&]*))?$/,m=>viewPolicy(m[1]?decodeURIComponent(m[1]):""),"policy"],
  [/^#\/composer$/,()=>viewComposer(),"composer"],
];
async function route(){
  // a re-render (navigation, or the 5s refresh) throws away the button the bubble is anchored to
  hideTip();
  const h=location.hash||"#/overview";
  for(const[re,fn,nav]of routes){
    const m=h.match(re);
    if(m){
      document.querySelectorAll(".nav-item").forEach(a=>
        a.classList.toggle("active",a.dataset.r===nav));
      try{await fn(m)}catch(e){page.innerHTML=
        `<div class="card"><div class="empty"><b>This page did not load</b>${esc(e.message)}<br><br>
        <button class="sm" onclick="route()">Try again</button></div></div>`}
      sidebarBadge();
      return;
    }
  }
  location.hash="#/overview";
}
window.addEventListener("hashchange",route);
$("#autorefresh").addEventListener("change",e=>{
  clearInterval(refreshTimer);
  if(e.target.checked)refreshTimer=setInterval(route,5000)});
route();
</script>
