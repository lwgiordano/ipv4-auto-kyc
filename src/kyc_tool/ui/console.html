<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC Tool · Ops Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
/* ── Semantic tokens (light + dark) ── */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-muted:#f1f2f5;
  --ink:#16191d; --text:#3d434b; --muted:#6b7280; --faint:#9aa1ac;
  --line:#e7e9ed; --line-strong:#d6d9df;
  --accent:#5b5bd6; --accent-soft:#ececfb; --accent-ink:#4747c2;
  --green:#16a34a; --green-soft:#e7f6ec;
  --amber:#d97706; --amber-soft:#fdf3e7;
  --red:#e5484d;   --red-soft:#fdeaea;
  --blue:#0a7ea4;  --blue-soft:#e6f3f8;
  --shadow-sm:0 1px 2px rgba(20,25,29,.05),0 1px 1px rgba(20,25,29,.04);
  --shadow-md:0 4px 16px rgba(20,25,29,.08),0 1px 3px rgba(20,25,29,.06);
  --r-md:12px; --r-sm:8px; --r-xs:6px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101114; --surface:#17181c; --surface-muted:#1e2025;
    --ink:#f3f4f6; --text:#c6cad1; --muted:#9aa1ac; --faint:#6d7380;
    --line:#24262c; --line-strong:#31343c;
    --accent:#8788ee; --accent-soft:rgba(122,123,235,.16); --accent-ink:#a2a3f3;
    --green:#34b768; --green-soft:rgba(46,180,100,.15);
    --amber:#e5940c; --amber-soft:rgba(229,148,12,.15);
    --red:#ef5a5e;   --red-soft:rgba(239,90,94,.15);
    --blue:#3fa9cf;  --blue-soft:rgba(63,169,207,.15);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 20px rgba(0,0,0,.5);
  }
}
/* ── Base ── */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
     font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
     -webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}

/* ── App shell: sidebar + independently scrolling main ── */
.shell{display:flex;height:100vh}
aside{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);
      display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:16px 16px 12px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
      display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand .t{font-size:14px;font-weight:650;color:var(--ink);line-height:1.2}
.brand .s{font-size:11px;color:var(--faint)}
nav{padding:4px 8px;flex:1}
.grp{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
     color:var(--faint);padding:16px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 0;
     border-radius:var(--r-xs);color:var(--text);font-size:13px;font-weight:500;
     min-height:36px;transition:background-color .15s ease-out}
.nav-item:hover{background:var(--surface-muted);text-decoration:none}
.nav-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
.nav-item.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-item.active svg{color:var(--accent)}
.nav-item .count{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;
     font-weight:650;border-radius:100px;padding:1px 7px;min-width:18px;text-align:center}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);
     display:grid;gap:8px}
.side-foot label{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:24px}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1160px;margin:0 auto;padding:24px 32px 64px}

/* ── Page title bar ── */
.tbar{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.tbar h1{font-size:20px;line-height:1.25;font-weight:650;color:var(--ink);margin:0}
.tbar .desc{font-size:13px;color:var(--muted);margin-top:2px}
.tbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.crumb{font-size:12.5px;color:var(--faint);margin-bottom:4px}
.crumb a{color:var(--muted)}

/* ── Cards & sections ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
      box-shadow:var(--shadow-sm)}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;
      align-items:center;gap:8px}
.card .hd h3{margin:0;font-size:13px;font-weight:600;color:var(--ink)}
.card .hd .hint{font-size:12.5px;color:var(--faint);font-weight:400}
.card .bd{padding:16px}
.card .bd.flush{padding:0}
.stack{display:grid;gap:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}

/* ── KPI scorecard row ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
     box-shadow:var(--shadow-sm);padding:16px}
.kpi .lab{font-size:12.5px;font-weight:500;color:var(--muted)}
.kpi .num{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
     margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .num.bad{color:var(--red)} .kpi .num.ok{color:var(--green)}
.kpi .foot{font-size:12px;color:var(--faint);margin-top:4px}

/* ── Pills / status ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;
      font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill svg{width:11px;height:11px}
.p-green{background:var(--green-soft);color:var(--green)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-accent{background:var(--accent-soft);color:var(--accent-ink)}
.p-neutral{background:var(--surface-muted);color:var(--muted)}
.tag{display:inline-block;background:var(--surface-muted);color:var(--muted);border-radius:5px;
     padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.err{background:var(--red-soft);color:var(--red)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--faint);text-align:left;
   padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .strong{color:var(--ink);font-weight:600}
tbody tr.click{cursor:pointer;transition:background-color .12s ease-out}
tbody tr.click:hover{background:var(--surface-muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.sub{font-size:12px;color:var(--faint);margin-top:1px}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:4px}
.empty a{font-weight:500}

/* ── Buttons & inputs (md 36px / sm 30px) ── */
button{font:inherit;font-size:13px;font-weight:550;padding:0 14px;height:36px;
  border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);cursor:pointer;transition:background-color .15s ease-out,border-color .15s ease-out}
button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-ink)}
button.sm{height:30px;padding:0 10px;font-size:12.5px}
button.good{background:var(--green-soft);border-color:transparent;color:var(--green)}
button.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;height:36px}
textarea{height:auto;min-height:180px;padding:10px;width:100%;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--faint)}
.search input{padding-left:32px;width:280px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field .flab{font-size:12.5px;font-weight:500;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .note{font-size:12.5px;color:var(--faint)}

/* ── Bullet chart (score vs threshold) ── */
.bullet{display:grid;gap:8px}
.bullet .val{display:flex;align-items:baseline;gap:8px}
.bullet .val b{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums}
.bullet .val .of{font-size:13px;color:var(--faint)}
.bullet .val .verdict{font-size:12.5px;font-weight:600;margin-left:auto}
.btrack{position:relative;height:16px;border-radius:5px;background:var(--surface-muted);overflow:visible}
.bband{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--line)}
.bmeasure{position:absolute;top:5px;height:6px;left:0;border-radius:3px}
.btick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.btick span{position:absolute;top:-18px;transform:translateX(-50%);font-size:11px;
  color:var(--muted);white-space:nowrap}
/* rubric contribution rows */
.contrib{display:grid;grid-template-columns:1fr 1fr;gap:2px 32px;margin-top:16px}
@media(max-width:820px){.contrib{grid-template-columns:1fr}}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);
  font-size:13px;min-height:32px}
.crow:nth-last-child(-n+2){border-bottom:none}
.crow .nm{color:var(--text)}
.crow .pts{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.crow .pts.zero{color:var(--faint);font-weight:400}
.crow .cap{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.sdot{width:16px;height:16px;border-radius:100px;display:inline-grid;place-items:center;
  font-size:10px;flex:none}
.sdot.g{background:var(--green-soft);color:var(--green)}
.sdot.r{background:var(--red-soft);color:var(--red)}
.sdot.a{background:var(--amber-soft);color:var(--amber)}
.sdot.n{background:var(--surface-muted);color:var(--faint)}

/* ── Gate cells (status strip) ── */
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gate{display:flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 12px;
  font-size:12.5px;font-weight:600;min-height:40px}
.gate.ok{background:var(--green-soft);color:var(--green)}
.gate.no{background:var(--red-soft);color:var(--red)}

/* ── Run pipeline steps ── */
.pipe{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11px}
.pipe .st{padding:2px 7px;border-radius:5px;color:var(--faint);background:var(--surface-muted)}
.pipe .st.done{color:var(--green);background:var(--green-soft)}
.pipe .st.cur{color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.pipe .st.fail{color:var(--red);background:var(--red-soft);font-weight:600}
.pipe .arr{color:var(--line-strong)}

/* ── Activity feed (audit) ── */
.feed{position:relative;padding-left:20px;display:grid;gap:0}
.feed::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.fitem{position:relative;padding:7px 0;font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fitem::before{content:"";position:absolute;left:-19px;top:13px;width:8px;height:8px;
  border-radius:100px;background:var(--line-strong);border:2px solid var(--surface)}
.fitem.hot::before{background:var(--accent)}
.when{white-space:nowrap}
.fitem .when{margin-left:auto;font-size:12px;color:var(--faint)}
.fitem .who{color:var(--ink);font-weight:600}
.fitem .obj{color:var(--muted)}
.fitem details{font-size:12px}
.fitem details[open]{width:100%;order:10}
.fitem summary{color:var(--faint);cursor:pointer;font-size:11.5px}
.feed-earlier{margin:0 0 6px -20px}
pre{background:var(--surface-muted);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px;overflow:auto;font-size:12px;line-height:1.5;max-height:320px;margin:8px 0 0}

/* ── Integration rows ── */
.irow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.itile{width:36px;height:36px;border-radius:var(--r-sm);background:var(--accent-soft);
  color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.irow .meta{min-width:0;flex:1}
.irow .nm{font-size:13px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.irow .kind{font-size:12.5px;color:var(--muted);margin-top:1px}
.irow .facts{font-size:12px;color:var(--faint);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.irow .todo{font-size:12px;color:var(--amber);margin-top:6px}
.irow .end{margin-left:auto;display:grid;gap:6px;justify-items:end;flex:none}
.probe-out{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;text-align:right}

/* ── kv grid, toast, banner ── */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 24px;font-size:13px}
.kv .k{color:var(--faint);font-size:12.5px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 16px;box-shadow:var(--shadow-md);font-size:13px;
  max-width:420px;z-index:30;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.banner{display:flex;gap:10px;align-items:center;background:var(--red-soft);color:var(--red);
  border-radius:var(--r-sm);padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:16px}
.banner a{color:inherit;font-weight:650}
.loading{color:var(--faint);font-size:13px;padding:48px;text-align:center}
h2.sec{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin:32px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">
    <div class="mark">K</div>
    <div><div class="t">KYC Tool</div><div class="s">Ops Console</div></div>
  </div>
  <nav id="nav">
    <a class="nav-item" href="#/overview" data-r="overview">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="7" rx="1"/><rect x="9" y="2" width="5" height="4" rx="1"/><rect x="9" y="8" width="5" height="6" rx="1"/><rect x="2" y="11" width="5" height="3" rx="1"/></svg>
      Overview<span class="count" id="deadbadge" hidden></span></a>
    <div class="grp">Investigate</div>
    <a class="nav-item" href="#/cases" data-r="cases">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 7h12M6 7v6"/></svg>
      Cases</a>
    <div class="grp">Wiring</div>
    <a class="nav-item" href="#/integrations" data-r="integrations">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2v4M10 2v4M4 6h8v3a4 4 0 0 1-8 0zM8 13v2"/></svg>
      Integrations</a>
    <a class="nav-item" href="#/fieldmap" data-r="fieldmap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h5M2 8h5M2 12h5M9 4h5M9 8h5M9 12h5"/><path d="M7 4l2 4-2 4" stroke-linejoin="round"/></svg>
      Field Map</a>
    <a class="nav-item" href="#/policy" data-r="policy">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l5 2v4c0 3.5-2.2 5.4-5 6-2.8-.6-5-2.5-5-6V4z" stroke-linejoin="round"/></svg>
      Policy</a>
    <div class="grp">Act</div>
    <a class="nav-item" href="#/composer" data-r="composer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5.5L2 6z" stroke-linejoin="round"/></svg>
      Composer</a>
  </nav>
  <div class="side-foot">
    <span id="envchip"></span>
    <span id="policychip" class="mono" style="font-size:10.5px"></span>
    <label><input type="checkbox" id="autorefresh"> auto-refresh 5s</label>
  </div>
</aside>
<main><div class="page" id="page"><div class="loading">Loading…</div></div></main>
</div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NBSP=" ";
async function j(url,opts){const r=await fetch(url,opts);const body=await r.json().catch(()=>({}));
  if(!r.ok&&r.status>=500)throw new Error(`${r.status}: ${JSON.stringify(body).slice(0,300)}`);
  return{status:r.status,body}}
function toast(msg,ms=4200){const t=document.createElement("div");t.className="toast";
  t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const fmtExact=s=>s?new Date(s).toLocaleString(undefined,{hour12:false}):"—";
function rel(s){if(!s)return"—";const d=new Date(s),now=Date.now(),sec=(now-d)/1e3;
  if(sec<50)return"just now";if(sec<3600)return`${Math.round(sec/60)}m ago`;
  if(sec<86400)return`${Math.round(sec/3600)}h ago`;
  if(sec<172800)return"yesterday";return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
const when=s=>`<span class="when" title="${esc(fmtExact(s))}">${esc(rel(s))}</span>`;

/* status pills */
const ICONS={check:"✓",cross:"✕",clock:"⏳",dot:"·",warn:"!",lock:"🔒",person:"👤",skull:"☠"};
const PILL={
  pass:["p-green","✓","Pass"],fail:["p-red","✕","Fail"],needs_review:["p-amber","!","Needs review"],
  missing:["p-neutral","·","Missing"],
  approve:["p-green","✓","Approve"],approve_buy_locked:["p-amber","🔒","Approve · buy locked"],
  manual_review_insufficient:["p-amber","⏳","Insufficient"],reject:["p-red","✕","Reject"],
  live:["p-green","●","Live"],stub:["p-amber","◌","Stub"],dev:["p-amber","◌","Dev engine"],
  "needs-config":["p-red","⚙","Needs config"],manual:["p-blue","👤","Manual"],
  open:["p-amber","⏳","Open"],done:["p-green","✓","Done"],
  delivered:["p-green","✓","Delivered"],pending:["p-amber","⏳","Pending"],
  dead:["p-red","☠","Dead"],queued:["p-neutral","⏳","Queued"],running:["p-accent","▶","Running"],
  clear:["p-green","✓","Clear"],allowed_broker:["p-amber","!","Allowed broker"],blocked:["p-red","✕","Blocked"],
};
const pill=(k,label)=>{const[c,i,d]=PILL[k]||["p-neutral","·",k];
  return`<span class="pill ${c}">${i}${NBSP}${esc(label??d)}</span>`};

const RUN_STATES=["QUEUED","RESOLVE_INPUTS","BROKER_GATE","RUN_ADAPTERS","VALIDATE","WRITE_CHECKS","SCORE","DECIDE","PUBLISH_DECISION","COMPLETE"];
function pipe(state){if(state==="FAILED")return`<span class="pipe"><span class="st fail">FAILED</span></span>`;
  const i=RUN_STATES.indexOf(state);
  return`<span class="pipe">`+RUN_STATES.map((s,k)=>
    `<span class="st ${k<i?"done":k===i?"cur":""}">${s.replace(/_/g," ")}</span>`
  ).join(`<span class="arr">›</span>`)+`</span>`}

function humanizeAudit(a){
  const d=a.detail_json||{};
  switch(a.action){
    case"event.received":return`event <b>${esc(d.event_type||"?")}</b> received`;
    case"run.created":return`run created for event`;
    case"run.broker_gate":return`broker gate → <b>${esc(d.broker_status)}</b>${d.short_circuit?" · short-circuit":""}`;
    case"adapter.recorded":return`adapter <b>${esc(d.adapter_id)}</b> · ${esc(d.status)} · ${d.latency_ms??0}ms`;
    case"check.created":return`check <b>${esc(d.check_type)}</b> → ${esc(d.status)}${d.points?` · +${d.points}`:""}`;
    case"check.superseded":return`check <b>${esc(d.check_type)}</b> superseded`;
    case"review_task.created":return`review task opened · <b>${esc(d.task_type)}</b>`;
    case"review_task.completed":return`review task completed · <b>${esc(d.result)}</b>`;
    case"poc.token_sent":return`POC token sent for <b>${esc(d.poc_handle)}</b>`;
    case"run.decided":return`decided <b>${esc(d.decision)}</b> · score ${d.score}`;
    case"reviewer.manual_approve":return`<b>manual approval</b> recorded`;
    case"run.failed":return`run <b>failed</b> · ${esc((d.error||"").slice(0,80))}`;
    case"run.stage":case"run.inputs_resolved":return null; // noise — keep in raw only
    default:return`${esc(a.action)}`;
  }
}

  // AUTHORITY: the trigger-maintained pointer row. decisions[] is decided_at-ordered for DISPLAY
  // only — transaction-start timestamps invert against commit order, and c.latest_decision goes

  const latest=d.pointer_decision||{},gates=latest.gates_json||{};

  const tokenRows=d.poc_tokens.map(t=>{
    const state=t.verified_at?pill("pass","Verified"):

        <div class="facts">
          ${a.env.length?`<span>${envChips(a.env)}</span>`:""}
          ${a.stats?`<span>${a.stats.calls} calls · ${(a.stats.error_rate*100).toFixed(0)}% err · p95 ${a.stats.p95_ms.toFixed(0)}ms · last ${esc(rel(a.stats.last_call_at))}</span>`
            :`<span>never called</span>`}
        </div>
        ${a.todo?`<div class="todo">! ${esc(a.todo)}</div>`:""}
      </div>
      <div class="end">${a.probeable?`<button class="sm" data-probe="${esc(a.adapter_id)}">Probe</button>
        <div class="probe-out" id="probe-${esc(a.adapter_id)}"></div>`:`<span class="sub">no probe</span>`}</div>
    </div>`).join("");
  page.innerHTML=tbar("Integrations","What is wired to a real upstream, what is stubbed, and what needs credentials")+`
    <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Platform ↔ tool</h3></div>
      <div class="irow"><div class="itile">CB</div>
        <div class="meta"><div class="nm">Decision callback ${pill(p.status)}</div>
          <div class="kind">POST {PLATFORM_CALLBACK_URL}/kyc/decision · HMAC-signed · at-least-once, dedupe on (case_id, run_id)</div>
          <div class="facts"><span>${p.callback_url_is_default_stub?`<span class="tag warn">○ default stub URL</span>`:`<span class="tag">✓ URL set</span>`}
            <span class="tag ${p.hmac_secret_set?"":"warn"}">${p.hmac_secret_set?"✓":"○"} HMAC secret</span>
            ${p.auth_disabled?`<span class="tag err">! auth disabled</span>`:""}</span></div>
          ${p.todo?`<div class="todo">! ${esc(p.todo)}</div>`:""}</div></div>
      <div class="irow"><div class="itile">✉</div>
        <div class="meta"><div class="nm">POC token email ${pill(d.email_sender.status)}</div>
          <div class="kind">${esc(d.email_sender.detail)}</div>
          <div class="todo">! ${esc(d.email_sender.todo)}</div></div></div>
      <div class="irow"><div class="itile">S3</div>
        <div class="meta"><div class="nm">Raw evidence store ${pill("live",d.object_store.kind)}</div>
          <div class="kind mono">${esc(d.object_store.root)}</div></div></div>
    </div>
    <div class="card"><div class="hd"><h3>Evidence adapters</h3><span class="hint">catalog order · nine adapters</span></div>${rows}</div>
    <p class="sub" style="margin-top:12px">${pill("live")} real upstream · ${pill("stub")} fixture data ·
      ${pill("dev")} dev implementation · ${pill("needs-config")} missing credentials · ${pill("manual")} human queue by design</p>`;
  page.querySelectorAll("[data-probe]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent="Probing…";
    const{body}=await j(`/ui/api/integrations/${b.dataset.probe}/probe`,{method:"POST"});
    const out=$(`#probe-${CSS.escape(b.dataset.probe)}`);
    out.innerHTML=body.targets
      ?Object.entries(body.targets).map(([k,v])=>
        `${v.reachable?"✓":"✕"} ${esc(k)} · ${esc(v.note||v.error||"")} · ${v.latency_ms}ms`).join("<br>")
      :esc(body.note||"");
    b.disabled=false;b.textContent="Probe"});
}

/* ── Field Map ────────────────────────────────────────── */
async function viewFieldMap(){
  const{body:pol}=await j("/ui/api/policy");
  const{body:cl}=await j("/ui/api/cases?limit=100");
  const selected=sessionStorage.getItem("fmCase")||cl.cases[0]?.id||"";
  let values={};
  if(selected){const r=await j(`/ui/api/cases/${encodeURIComponent(selected)}/full`);
    if(r.status<300)values=r.body.salesforce}
  const rows=Object.entries(pol.field_sources).map(([field,src])=>{
    const v=values[field];
    const shown=field==="KYC_Check__c"?(v?`${v.length} child record(s)`:""):
      (v===undefined||v===null?"":String(v));
    return`<tr><td class="mono">${esc(field)}</td>
      <td>${selected?(shown===""?`<span class="sub">—</span>`:`<span class="strong">${esc(shown)}</span>`)
        :`<span class="sub">pick a case →</span>`}</td>
      <td class="sub">${esc(src)}</td></tr>`}).join("");
  page.innerHTML=tbar("Salesforce field map",
    "The one-way, platform-owned sync — docs/SALESFORCE_MAPPING.md in executable form")+`
    <div class="toolbar">
      <label class="note" for="fmcase">Preview with case</label>
      <select id="fmcase"><option value="">— none —</option>
        ${cl.cases.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?"selected":""}>${esc(c.id)} · ${esc(c.company_name||"")}</option>`).join("")}
      </select></div>
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th style="width:250px">Salesforce field</th><th style="width:250px">Value for selected case</th>
      <th>Source of truth in the tool</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <p class="sub" style="margin-top:12px">Delivery: upsert by platform case id · dedupe on (case_id, run_id) ·
      ordered per case · a Salesforce outage never blocks enforcement · fields read-only for non-integration users.</p>`;
  $("#fmcase").onchange=e=>{sessionStorage.setItem("fmCase",e.target.value);viewFieldMap()};
}

/* ── Policy ───────────────────────────────────────────── */
async function viewPolicy(){
  const{body:p}=await j("/ui/api/policy");
  const rubric=p.rubric.map(r=>`<tr>
    <td class="mono">${esc(r.check_type)}</td><td class="num strong">+${r.points}</td>
    <td class="sub">${esc(r.category)}</td><td>${r.mode==="manual"?pill("manual"):`<span class="sub">${esc(r.mode)}</span>`}</td>
    <td class="sub">${esc(r.pass_rule)}</td></tr>`).join("");
  const decisions=p.decisions.map(d0=>`<tr><td class="num">${d0.priority}</td><td>${pill(d0.decision)}</td>
    <td class="sub">${esc(d0.condition)}</td><td class="sub">${esc(d0.platform_enforcement)}</td></tr>`).join("");
  const brokers=p.broker_entities.map(b=>{
    const ids=["aliases","domains","email_domains","org_ids","poc_handles","asns"]
      .flatMap(k=>(b[k]||[]).map(v=>`<span class="tag">${esc(v)}</span>`)).join(" ");
    return`<tr><td class="strong">${esc(b.name)}</td>
      <td>${b.policy==="blocked"?pill("blocked","Blocked · auto-reject"):pill("clear","Allowed · tagged")}</td>
      <td>${ids||`<span class="sub">name only — ops add identifiers via SQL</span>`}</td></tr>`}).join("");
  page.innerHTML=tbar("Policy","The normative machine-readable rules the engine runs on",
      `<span class="tag" title="policy bundle sha256">${esc(p.bundle_hash.slice(0,16))}…</span>`)+`
    <div class="card"><div class="hd"><h3>Scoring rubric</h3><span class="hint">threshold ${p.threshold} · live checks only</span></div>
      <div class="bd flush"><table>
      <thead><tr><th>Check</th><th class="num">Points</th><th>Category</th><th>Mode</th><th>Pass rule — deterministic</th></tr></thead>
      <tbody>${rubric}</tbody></table></div></div>
    <h2 class="sec">Decision policy — priority order</h2>
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th class="num">#</th><th>Decision</th><th>Condition</th><th>Platform enforcement</th></tr></thead>
      <tbody>${decisions}</tbody></table></div></div>
    <h2 class="sec">Broker policy — exact identifier match only</h2>
    <div class="card"><div class="bd flush"><table>
      <thead><tr><th>Entity</th><th>Policy</th><th>Identifiers — aliases / domains / org-ids / pocs / asns</th></tr></thead>
      <tbody>${brokers}</tbody></table></div></div>
    <h2 class="sec">Hard gates</h2>
    <div class="card"><div class="bd"><pre style="margin:0">${esc(JSON.stringify(p.hard_gates,null,2))}</pre></div></div>
    <h2 class="sec">Event catalog</h2>
    <div class="card"><div class="bd chips">${p.events.map(e=>`<span class="tag">${esc(e)}</span>`).join("")}</div></div>`;
}

/* ── Composer ─────────────────────────────────────────── */
async function viewComposer(){
  const{body:t}=await j("/ui/api/event-templates");
  const caseId=sessionStorage.getItem("composerCase")||"demo-case-001";
  page.innerHTML=tbar("Composer","Send platform events into the tool — signed server-side, idempotency key auto-generated")+`
    <div class="split">
      <div class="card"><div class="hd"><h3>Event</h3></div><div class="bd">
        <div class="field"><label class="flab" for="c-case">Case ID</label>
          <input id="c-case" value="${esc(caseId)}"></div>
        <div class="field"><label class="flab" for="c-type">Event type</label>
          <select id="c-type">${t.event_types.map(e=>`<option ${e==="kyb.run_requested"?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
        <div class="field"><label class="flab" for="c-payload">Payload (JSON)</label>
          <textarea id="c-payload" spellcheck="false"></textarea></div>
        <div class="toolbar" style="margin:0">
          <button class="primary" id="c-send">Send event</button>
          <span class="note">the pipeline worker must be running to process it</span></div>
      </div></div>
      <div class="stack">
        <div class="card"><div class="hd"><h3>Result</h3></div><div class="bd">
          <pre id="c-out" style="margin:0">—</pre>
          <div class="sub" id="c-hint" style="margin-top:8px"></div></div></div>
        <div class="card"><div class="hd"><h3>Demo journey</h3></div><div class="bd" style="font-size:13px;color:var(--muted)">
          The dev-stack fixtures recognise <span class="strong">Acme Networks Ltd</span>:
          <code>kyb.run_requested</code> → <code>email.verified</code> →
          <code>org_id.submitted</code> (ORG-ACME-1) walks a case to
          ${pill("approve")}. Complete the website task from the case page for +10.</div></div>
      </div>
    </div>`;
  const fill=()=>$("#c-payload").value=JSON.stringify(t.templates[$("#c-type").value]??{},null,2);
  $("#c-type").onchange=fill;fill();
  $("#c-send").onclick=async()=>{
    let payload;try{payload=JSON.parse($("#c-payload").value||"{}")}
    catch(e){toast("✕ Payload is not valid JSON");return}
    const r=await j("/ui/api/send-event",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({case_id:$("#c-case").value.trim(),event_type:$("#c-type").value,payload})});
    $("#c-out").textContent=`HTTP ${r.status}\n`+JSON.stringify(r.body,null,2);
    sessionStorage.setItem("composerCase",$("#c-case").value.trim());
    if(r.status<300)$("#c-hint").innerHTML=
      `Queued jobs: <span class="strong">${r.body.jobs_queued}</span> — open ${caseLink($("#c-case").value.trim())} to watch it process`;
  };
}

/* ── Router ───────────────────────────────────────────── */
const routes=[
  [/^#\/overview$/,()=>viewOverview(),"overview"],
  [/^#\/cases$/,()=>viewCases(),"cases"],
  [/^#\/case\/(.+)$/,m=>viewCase(decodeURIComponent(m[1])),"cases"],
  [/^#\/integrations$/,()=>viewIntegrations(),"integrations"],
  [/^#\/fieldmap$/,()=>viewFieldMap(),"fieldmap"],
  [/^#\/policy$/,()=>viewPolicy(),"policy"],
  [/^#\/composer$/,()=>viewComposer(),"composer"],
];
async function route(){
  const h=location.hash||"#/overview";
  for(const[re,fn,nav]of routes){
    const m=h.match(re);
    if(m){
      document.querySelectorAll(".nav-item").forEach(a=>
        a.classList.toggle("active",a.dataset.r===nav));
      try{await fn(m)}catch(e){page.innerHTML=
        `<div class="card"><div class="empty"><b>Couldn’t load this view</b>${esc(e.message)}<br><br>
        <button class="sm" onclick="route()">Retry</button></div></div>`}
      sidebarBadge();
      return;
    }
  }
  location.hash="#/overview";
}
window.addEventListener("hashchange",route);
$("#autorefresh").addEventListener("change",e=>{
  clearInterval(refreshTimer);
  if(e.target.checked)refreshTimer=setInterval(route,5000)});
route();
</script>
