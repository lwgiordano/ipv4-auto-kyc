name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kyc-tool:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KYC_TEST_DATABASE_URL: postgresql+psycopg://kyc:kyc@localhost:5432/kyc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Import contracts (import-linter)
        run: lint-imports
      - name: Tests
        run: pytest -q -p no:warnings

  substrate-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-kits/agent-substrate-kit
    steps:
      - uses: actions/checkout@v4
      - name: Kit end-to-end tests
        run: bash tests/run-tests.sh
      - name: Shellcheck kit scripts and templates
        run: |
          shellcheck -x bootstrap.sh lib/*.sh tests/run-tests.sh \
            templates/manage.sh templates/substrate/lib.sh \
            templates/substrate/checks.d/*.sh templates/substrate/hooks/pre-commit
