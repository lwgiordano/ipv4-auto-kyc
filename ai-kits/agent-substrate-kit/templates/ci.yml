# Seeded by agent-substrate-kit v{{KIT_VERSION}} — CI through the same
# entry point agents and humans use.
name: substrate-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: ./manage.sh setup
      - name: Doctor
        run: ./manage.sh doctor
      - name: Lint
        run: ./manage.sh lint
      - name: Test
        run: ./manage.sh test
